<!doctype html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tablet de turno</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#111214">
<meta name="color-scheme" content="dark">
<link rel="manifest" href="/turno/manifest.webmanifest">
<link rel="icon" href="/favicon-32.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
:root {
  --bg: #000; --surface: #161617; --surface2: #1f1f22; --fg: #f5f5f7; --muted: #a1a1a6; --line: #2e2e30;
  --amber: #ffcc00; --amber-ink: #111; --ok: #30d158; --ok-soft: #12301d; --bad: #ff6961; --bad-soft: #3a1714; --warn: #fab219; --warn-soft: #3a3010;
  --info: #3d8fd6; --info-soft: #102538;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", "Segoe UI", Roboto, Arial, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 17px; line-height: 1.45; -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
body { overflow-x: clip; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--amber); outline-offset: 2px; border-radius: 6px; }
h1, h2, h3 { margin: 0; line-height: 1.15; letter-spacing: -0.02em; }
svg.i { width: 1.25em; height: 1.25em; flex: none; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 52px; padding: 0 22px; border-radius: 14px; border: 1px solid transparent; font-weight: 600; cursor: pointer; transition: transform .12s, background .2s; }
.btn:active { transform: scale(.97); }
.btn:disabled { opacity: .5; cursor: progress; }
.btn-primary { background: var(--amber); color: var(--amber-ink); }
.btn-ok { background: var(--ok); color: #04210f; }
.btn-line { background: var(--surface); border-color: var(--line); }
.btn-bad { background: transparent; color: var(--bad); border-color: currentColor; }
.btn-sm { min-height: 42px; padding: 0 16px; border-radius: 12px; font-size: .95rem; }
.muted { color: var(--muted); }
#terminar .corto { display: none; }
@media (max-width: 760px) { #terminar .corto { display: inline; } }
.err { color: var(--bad); font-size: .92rem; min-height: 1.3em; margin: 6px 0 0; }

/* ---------- Entrada ---------- */
#entrada { min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; align-items: center; padding: 24px 16px calc(24px + env(safe-area-inset-bottom)); }
.caja-entrada { width: min(100%, 640px); text-align: center; margin: auto 0; }
.caja-entrada img { height: 64px; margin: 0 auto 10px; display: block; }
.caja-entrada h1 { font-size: 1.9rem; margin-bottom: 4px; }
.paso { margin-top: 26px; }
.paso > h2 { font-size: 1.05rem; color: var(--muted); font-weight: 500; margin-bottom: 12px; }
.personas { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 10px; }
.persona { min-height: 78px; border-radius: 16px; border: 2px solid var(--line); background: var(--surface); font-size: 1.25rem; font-weight: 700; letter-spacing: .02em; cursor: pointer; display: grid; place-items: center; gap: 2px; padding: 8px; }
.persona small { font-size: .78rem; font-weight: 500; color: var(--muted); letter-spacing: 0; }
.persona[aria-pressed="true"] { border-color: var(--amber); background: #2a2405; }
.turnos { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
.chip { min-height: 48px; padding: 0 18px; border-radius: 999px; border: 2px solid var(--line); background: var(--surface); font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; }
.chip[aria-pressed="true"] { border-color: var(--amber); background: #2a2405; }
.puntos { display: flex; gap: 16px; justify-content: center; margin: 4px 0 14px; }
.puntos i { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--muted); }
.puntos i.on { background: var(--amber); border-color: var(--amber); }
.puntos.mal { animation: sacude .35s; }
@keyframes sacude { 25% { transform: translateX(-10px); } 75% { transform: translateX(10px); } }
.teclado { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; max-width: 340px; margin: 0 auto; }
.teclado button { min-height: 68px; border-radius: 16px; border: 0; background: var(--surface2); font-size: 1.6rem; font-weight: 600; cursor: pointer; font-variant-numeric: tabular-nums; }
.teclado button:active { background: #33333a; }
.teclado .sec { background: transparent; font-size: 1rem; color: var(--muted); }

/* ---------- App ---------- */
#app { min-height: 100vh; min-height: 100dvh; display: grid; grid-template-rows: auto 1fr; }
header.bar { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 12px; padding: 10px 16px; padding-top: calc(10px + env(safe-area-inset-top)); background: rgba(22,22,23,.88); -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px); border-bottom: 1px solid rgba(255,255,255,.07); }
.quien { display: flex; align-items: center; gap: 10px; margin-right: auto; min-width: 0; }
.avatar { width: 46px; height: 46px; border-radius: 50%; background: var(--amber); color: var(--amber-ink); display: grid; place-items: center; font-weight: 800; font-size: .7rem; letter-spacing: -.02em; flex: none; }
.quien b { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.quien > div { min-width: 0; }
.quien b { display: block; font-size: 1.05rem; }
.quien small { color: var(--muted); font-size: .85rem; white-space: nowrap; }
.cuerpo { display: grid; grid-template-columns: 220px minmax(0, 1fr); min-height: 0; }
nav.secciones { padding: 14px 10px; border-right: 1px solid var(--line); display: flex; flex-direction: column; gap: 6px; position: sticky; top: 64px; align-self: start; }
nav.secciones button { display: flex; align-items: center; gap: 12px; min-height: 54px; padding: 0 14px; border: 0; border-radius: 14px; background: transparent; font-weight: 600; text-align: left; cursor: pointer; }
nav.secciones button[aria-current="true"] { background: var(--surface2); }
nav.secciones .ic { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; flex: none; }
nav.secciones .n { margin-left: auto; min-width: 26px; height: 26px; padding: 0 8px; border-radius: 999px; background: var(--amber); color: var(--amber-ink); font-size: .85rem; display: grid; place-items: center; font-variant-numeric: tabular-nums; }
.c-aviso { background: #2a2405; color: var(--amber); }
.c-tarea { background: var(--info-soft); color: #7db8ec; }
.c-incid { background: var(--bad-soft); color: var(--bad); }
.c-gasto { background: #2b1630; color: #e08ad0; }
.c-corte { background: var(--ok-soft); color: var(--ok); }
main.sec { padding: 20px 20px calc(30px + env(safe-area-inset-bottom)); max-width: 860px; width: 100%; }
main.sec > h2 { font-size: 1.6rem; margin-bottom: 4px; }
main.sec > p.sub { color: var(--muted); margin: 0 0 18px; }
.tarjeta { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 16px; margin-bottom: 12px; }
.tarjeta.nuevo { border-color: var(--amber); }
.tarjeta h3 { font-size: 1.12rem; margin-bottom: 4px; }
.tarjeta .det { color: #d6d6da; white-space: pre-wrap; margin: 6px 0 0; }
.meta { color: var(--muted); font-size: .88rem; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.fila { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.fila .btn { margin-left: auto; }
.vacio { text-align: center; color: var(--muted); padding: 34px 12px; border: 1px dashed var(--line); border-radius: 18px; }
.etq { display: inline-flex; align-items: center; gap: 5px; padding: 2px 10px; border-radius: 999px; font-size: .82rem; font-weight: 600; }
.g-leve { background: var(--info-soft); color: #7db8ec; }
.g-media { background: var(--warn-soft); color: var(--warn); }
.g-grave { background: var(--bad-soft); color: var(--bad); }
.e-ok { background: var(--ok-soft); color: var(--ok); }
.e-alta { background: var(--bad-soft); color: var(--bad); }
label.campo { display: block; margin-bottom: 14px; }
label.campo > span { display: block; font-weight: 600; margin-bottom: 6px; }
input.t, textarea.t, select.t { width: 100%; min-height: 52px; padding: 12px 14px; border-radius: 14px; border: 1px solid var(--line); background: #0d0d0e; }
textarea.t { min-height: 92px; resize: vertical; }
input.monto { font-size: 1.6rem; font-weight: 700; font-variant-numeric: tabular-nums; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chips .chip { min-height: 44px; font-size: .95rem; }
.foto { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.foto img { width: 96px; height: 96px; object-fit: cover; border-radius: 12px; border: 1px solid var(--line); }
.foto input { display: none; }
.total { display: flex; justify-content: space-between; align-items: baseline; padding: 14px 4px 0; border-top: 1px solid var(--line); margin-top: 6px; font-weight: 700; font-size: 1.15rem; font-variant-numeric: tabular-nums; }
.gasto { display: flex; gap: 12px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--line); }
.gasto:last-child { border-bottom: 0; }
.gasto .m { margin-left: auto; font-weight: 700; font-variant-numeric: tabular-nums; }
.denom { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; margin-bottom: 14px; }
.denom label { display: flex; align-items: center; gap: 8px; background: #0d0d0e; border: 1px solid var(--line); border-radius: 12px; padding: 6px 10px; }
.denom label b { min-width: 58px; font-variant-numeric: tabular-nums; }
.denom input { width: 100%; min-width: 0; border: 0; background: transparent; min-height: 40px; font-size: 1.1rem; text-align: right; font-variant-numeric: tabular-nums; }
.aviso-ok { display: flex; gap: 12px; align-items: center; background: var(--ok-soft); color: #c9f5d6; border-radius: 16px; padding: 14px 16px; margin-bottom: 14px; }
.aviso-ok svg { color: var(--ok); }
details.calc summary { cursor: pointer; color: var(--amber); font-weight: 600; min-height: 44px; display: flex; align-items: center; }
dialog { border: 1px solid var(--line); border-radius: 20px; background: var(--surface); color: var(--fg); padding: 20px; width: min(92vw, 520px); }
dialog::backdrop { background: rgba(0,0,0,.65); }
dialog h3 { font-size: 1.25rem; margin-bottom: 8px; }
dialog .acciones { display: flex; gap: 10px; justify-content: flex-end; margin-top: 16px; flex-wrap: wrap; }
#toast { position: fixed; left: 50%; bottom: calc(22px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: var(--fg); color: #000; padding: 12px 20px; border-radius: 14px; font-weight: 600; z-index: 50; box-shadow: 0 10px 30px rgba(0,0,0,.5); max-width: 92vw; }
#toast.mal { background: var(--bad); color: #fff; }

/* Tablet vertical y teléfono: secciones abajo */
@media (max-width: 760px) {
  .cuerpo { grid-template-columns: 1fr; }
  nav.secciones { position: fixed; bottom: 0; left: 0; right: 0; top: auto; z-index: 6; flex-direction: row; justify-content: space-around; padding: 6px 6px calc(6px + env(safe-area-inset-bottom)); border-right: 0; border-top: 1px solid var(--line); background: rgba(22,22,23,.95); -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px); gap: 2px; }
  nav.secciones button { flex: 1; flex-direction: column; gap: 2px; min-height: 60px; padding: 4px 2px; font-size: .74rem; font-weight: 600; position: relative; justify-content: center; text-align: center; }
  nav.secciones .ic { width: 30px; height: 30px; }
  nav.secciones .n { position: absolute; top: 2px; right: calc(50% - 26px); min-width: 20px; height: 20px; font-size: .72rem; padding: 0 5px; margin: 0; }
  main.sec { padding: 16px 16px calc(96px + env(safe-area-inset-bottom)); }
  .quien small .largo, #terminar .largo { display: none; }
}
</style>
</head>

<script>
// Si la sesión de Cloudflare Access vence, las llamadas a la API reciben una redirección
// al inicio de sesión; en vez de fallar con "sin conexión", se recarga la página para entrar de nuevo.
(() => {
  const f = window.fetch.bind(window);
  let avisado = false;
  window.fetch = async (u, o = {}) => {
    const interna = typeof u === "string" && u.startsWith("/");
    const r = await f(u, interna ? { redirect: "manual", ...o } : o);
    if (interna && (r.type === "opaqueredirect" || r.status === 0) && !avisado) {
      avisado = true;
      alert("Tu sesión venció. La página se va a recargar para que vuelvas a entrar.");
      location.reload();
      throw new Error("sesion");
    }
    return r;
  };
})();
</script>

<script>
(() => {
  "use strict";
  const $ = s => document.querySelector(s);
  const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const dinero = v => "$" + Number(v || 0).toLocaleString("es-MX", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const hora = iso => iso ? new Date(iso).toLocaleTimeString("es-MX", { hour: "2-digit", minute: "2-digit", timeZone: "America/Mexico_City" }) : "";
  const fechaCorta = iso => iso ? new Date(iso).toLocaleString("es-MX", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit", timeZone: "America/Mexico_City" }) : "";
  const diaTxt = d => d ? new Date(d + "T12:00:00Z").toLocaleDateString("es-MX", { weekday: "long", day: "numeric", month: "long", timeZone: "UTC" }) : "";
  const ICONO_TURNO = { "MAÑANA": "i-sol", "TARDE": "i-tarde", "NOCHE": "i-luna" };
  const GRAV = { leve: "Leve", media: "Media", grave: "Grave" };
  const EST_INC = { abierta: "Abierta", en_proceso: "En proceso", resuelta: "Resuelta" };

  async function api(ruta, datos) {
    const op = datos === undefined ? {} : { method: "POST", headers: { "Content-Type": "application/json", "X-Turno": "1" }, body: JSON.stringify(datos) };
    let r, j;
    try { r = await fetch("/turno/api/" + ruta, { credentials: "same-origin", ...op }); } catch { throw Object.assign(new Error("Sin conexión. Revisa el internet y vuelve a intentar."), { red: true }); }
    try { j = await r.json(); } catch { j = { ok: false, error: r.status === 401 || r.status === 403 ? "La tablet perdió el acceso. Recarga la página." : "Error del servidor (" + r.status + ")." }; }
    if (j.sesion === false) { mostrarEntrada(); throw new Error(j.error); }
    if (!j.ok) throw Object.assign(new Error(j.error || "Error"), { datos: j });
    return j;
  }
  let tToast;
  function toast(msg, mal) {
    const t = $("#toast"); t.textContent = msg; t.className = mal ? "mal" : ""; t.hidden = false;
    clearTimeout(tToast); tToast = setTimeout(() => { t.hidden = true; }, mal ? 5000 : 2600);
  }

  // ======================= Entrada =======================
  let elegido = null, turnoElegido = null, pin = "";
  async function mostrarEntrada() {
    $("#app").hidden = true; $("#entrada").hidden = false;
    elegido = null; pin = ""; pintarPin();
    $("#paso-turno").hidden = true; $("#paso-pin").hidden = true; $("#err-pin").textContent = "";
    try {
      const j = await api("personas");
      turnoElegido = j.sugerido;

  // Reduce la foto a máx. 1400 px y JPEG para que suba rápido
  async function comprimir(file) {
    const url = URL.createObjectURL(file);
    try {
      const img = await new Promise((ok, mal) => { const i = new Image(); i.onload = () => ok(i); i.onerror = mal; i.src = url; });
      let lado = 1280, q = 0.72, out;
      for (let n = 0; n < 5; n++) {
        const k = Math.min(1, lado / Math.max(img.naturalWidth, img.naturalHeight));
        const c = document.createElement("canvas"); c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
        out = c.toDataURL("image/jpeg", q);
        if (out.length < 700_000) return out;
        lado *= 0.8; q = Math.max(0.55, q - 0.07);
      }
      return out;
    } finally { URL.revokeObjectURL(url); }
  }

  }
  $("#terminar").addEventListener("click", async () => {
    const pend = E && !E.corte ? " Todavía no entregas el corte." : "";
    if (await confirmar("¿Terminar turno?", "Se cerrará tu sesión en la tablet." + pend, "Terminar turno")) salir();
  });
  // Por seguridad: tras 30 minutos sin tocar la tablet se cierra la sesión
  let ultimo = Date.now();
  ["pointerdown", "keydown"].forEach(ev => document.addEventListener(ev, () => { ultimo = Date.now(); }, { passive: true }));
  setInterval(() => {
    if (!E) return;
    if (Date.now() - ultimo > 30 * 60e3) { salir(); toast("Sesión cerrada por inactividad."); return; }
    // Refresca avisos y tareas cada 2 minutos si no hay un formulario a medio llenar
    const ocupado = document.activeElement && /INPUT|TEXTAREA/.test(document.activeElement.tagName) || $("#dlg").open;
    if (!ocupado && (seccion === "avisos" || seccion === "tareas") && Date.now() - (window._ultRef || 0) > 120e3) {
      window._ultRef = Date.now();
      cargar().then(() => ir(seccion)).catch(() => {});
    } else if (Date.now() - (window._ultRef || 0) > 120e3) { window._ultRef = Date.now(); cargar().catch(() => {}); }
  }, 20e3);

  // Al abrir: si ya hay sesión, directo al turno
  (async () => {
    try { await abrirApp(); } catch { mostrarEntrada(); }
  })();
})();
</script>
</body>
</html>
