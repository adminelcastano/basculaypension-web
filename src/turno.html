<!doctype html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tablet de turno</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#111214">
<meta name="color-scheme" content="dark">
<link rel="manifest" href="/turno.webmanifest">
<link rel="icon" href="/favicon-32.png">
<link rel="apple-touch-icon" href="/img/turno-192.png">
<style>
:root {
  --bg: #000; --surface: #161617; --surface2: #1f1f22; --fg: #f5f5f7; --muted: #a1a1a6; --line: #2e2e30;
  --amber: #ffcc00; --amber-ink: #111; --ok: #30d158; --ok-soft: #12301d; --bad: #ff6961; --bad-soft: #3a1714; --warn: #fab219; --warn-soft: #3a3010;
  --info: #3d8fd6; --info-soft: #102538;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", "Segoe UI", Roboto, Arial, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 1rem; line-height: 1.45; -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
html { font-size: 17px; } html.letra-grande { font-size: 19px; } html.letra-muy-grande { font-size: 21px; }
body { overflow-x: clip; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--amber); outline-offset: 2px; border-radius: 6px; }
h1, h2, h3 { margin: 0; line-height: 1.15; letter-spacing: -0.02em; }
svg.i { width: 1.25em; height: 1.25em; flex: none; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 52px; padding: 0 22px; border-radius: 14px; border: 1px solid transparent; font-weight: 600; cursor: pointer; transition: transform .12s, background .2s; }
.btn:active { transform: scale(.97); }
.btn:disabled { opacity: .5; cursor: progress; }
.btn-primary { background: var(--amber); color: var(--amber-ink); }
.btn-ok { background: var(--ok); color: #04210f; }
.btn-line { background: var(--surface); border-color: var(--line); }
.btn-bad { background: transparent; color: var(--bad); border-color: currentColor; }
.btn-sm { min-height: 42px; padding: 0 16px; border-radius: 12px; font-size: .95rem; }
.muted { color: var(--muted); }
#terminar .corto { display: none; }
@media (max-width: 760px) { #terminar .corto { display: inline; } }
.err { color: var(--bad); font-size: .92rem; min-height: 1.3em; margin: 6px 0 0; }

/* ---------- Entrada ---------- */
#entrada { min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; align-items: center; padding: 24px 16px calc(24px + env(safe-area-inset-bottom)); }
.caja-entrada { width: min(100%, 640px); text-align: center; margin: auto 0; }
.caja-entrada img { height: 64px; margin: 0 auto 10px; display: block; }
.caja-entrada h1 { font-size: 1.9rem; margin-bottom: 4px; }
.paso { margin-top: 26px; }
.paso > h2 { font-size: 1.05rem; color: var(--muted); font-weight: 500; margin-bottom: 12px; }
.aviso-abierto { display: flex; gap: 10px; align-items: flex-start; text-align: left; max-width: 560px; margin: 0 auto 16px; padding: 12px 14px; border-radius: 14px; background: var(--warn-soft); color: #ffe4a3; font-size: .92rem; }
.aviso-abierto svg { width: 20px; height: 20px; flex: none; color: var(--warn); margin-top: 1px; }
.personas { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 14px 10px; }
.persona { border: 0; background: none; color: var(--fg); font-size: 1.15rem; font-weight: 700; letter-spacing: .02em; cursor: pointer; display: grid; justify-items: center; align-content: start; gap: 2px; padding: 6px 4px; border-radius: 16px; }
.persona:hover .pfoto { transform: scale(1.04); }
.persona small { font-size: .78rem; font-weight: 500; color: var(--muted); letter-spacing: 0; }
.persona .pfoto { width: 84px; height: 84px; border-radius: 50%; display: block; margin-bottom: 6px; transition: transform .15s, box-shadow .15s; }
.persona .pfoto.ini { display: grid; place-items: center; background: #2a2a2d; color: #d2d2d7; font-size: 1.5rem; font-weight: 800; }
.avatar.foto { background: none; overflow: hidden; }
.avatar img { width: 100%; height: 100%; border-radius: 50%; display: block; }
.persona[aria-pressed="true"] .pfoto { box-shadow: 0 0 0 3px var(--bg), 0 0 0 6px var(--amber); }
.persona[aria-pressed="true"] { color: var(--amber); }
/* Imagen de perfil junto a avisos, incidencias, gastos y cortes */
.avi { width: 40px; height: 40px; border-radius: 50%; display: block; flex: none; object-fit: cover; }
.avi.ch { width: 22px; height: 22px; display: inline-block; vertical-align: -6px; margin-right: 6px; }
.turnos { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
.chip { min-height: 48px; padding: 0 18px; border-radius: 999px; border: 2px solid var(--line); background: var(--surface); font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; }
.chip[aria-pressed="true"] { border-color: var(--amber); background: #2a2405; }
.puntos { display: flex; gap: 16px; justify-content: center; margin: 4px 0 14px; }
.puntos i { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--muted); }
.puntos i.on { background: var(--amber); border-color: var(--amber); }
.puntos.mal { animation: sacude .35s; }
@keyframes sacude { 25% { transform: translateX(-10px); } 75% { transform: translateX(10px); } }
.teclado { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; max-width: 340px; margin: 0 auto; }
.teclado button { min-height: 68px; border-radius: 16px; border: 0; background: var(--surface2); font-size: 1.6rem; font-weight: 600; cursor: pointer; font-variant-numeric: tabular-nums; }
.teclado button:active { background: #33333a; }
.teclado .sec { background: transparent; font-size: 1rem; color: var(--muted); }

/* ---------- App (mismo estilo que el panel de administración) ---------- */
#app { min-height: 100vh; min-height: 100dvh; }
header.bar { position: sticky; top: 0; z-index: 30; display: flex; align-items: center; gap: 12px; height: 60px; padding: 0 16px; padding-top: env(safe-area-inset-top); box-sizing: content-box;
  background: #161617; border-bottom: 1px solid rgba(255,255,255,.07); }
header.bar img { height: 34px; width: auto; display: block; }
.modulos { display: flex; gap: 2px; background: #2a2a2d; padding: 3px; border-radius: 12px; margin-right: auto; }
.modulos button { border: 0; background: transparent; color: #d2d2d7; font-weight: 600; font-size: 14px; letter-spacing: .02em; text-transform: uppercase; padding: 9px 16px; border-radius: 9px; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; position: relative; }
.modulos button[aria-current="page"] { background: var(--amber); color: var(--amber-ink); }
.modulos .mi { display: none; width: 24px; height: 24px; }
.modulos .n { min-width: 20px; height: 20px; padding: 0 6px; border-radius: 999px; background: #d70015; color: #fff; font-size: 11.5px; display: grid; place-items: center; letter-spacing: 0; font-variant-numeric: tabular-nums; }
.modulos button[aria-current="page"] .n { background: var(--amber-ink); color: var(--amber); }
.yo { display: flex; align-items: center; gap: 10px; min-width: 0; border: 0; background: none; color: inherit; font: inherit; text-align: left; padding: 4px 10px 4px 4px; border-radius: 999px; cursor: pointer; }
.yo:hover { background: #1f1f22; }
.yo .lapiz { width: 20px; height: 20px; border-radius: 50%; background: #2a2a2d; display: grid; place-items: center; margin-left: -18px; align-self: flex-end; flex: none; }
.yo .lapiz svg { width: 12px; height: 12px; }
/* Mi perfil */
.gal { display: flex; flex-wrap: wrap; gap: 10px; }
.gal button { width: 68px; height: 68px; border-radius: 50%; border: 3px solid transparent; padding: 0; background: #2a2a2d; color: var(--muted); cursor: pointer; display: grid; place-items: center; font-weight: 800; font-size: .72rem; overflow: hidden; }
.gal button img { width: 100%; height: 100%; display: block; border-radius: 50%; object-fit: cover; }
.gal button[aria-pressed="true"] { border-color: var(--amber); box-shadow: 0 0 0 3px #000 inset; }
.gal .subir { background: #1f1f22; border: 2px dashed #48484a; font-size: .7rem; font-weight: 600; line-height: 1.1; text-align: center; color: #d2d2d7; }
.gal .subir svg { width: 20px; height: 20px; display: block; margin: 0 auto 2px; }
.sws { display: flex; flex-wrap: wrap; gap: 10px; }
.sws button { width: 48px; height: 48px; border-radius: 50%; border: 3px solid transparent; background: var(--s); cursor: pointer; box-shadow: 0 0 0 3px #000 inset; }
.sws button[aria-pressed="true"] { border-color: var(--fg); }
.avatar { width: 40px; height: 40px; border-radius: 50%; background: var(--amber); color: var(--amber-ink); display: grid; place-items: center; font-weight: 800; font-size: .68rem; letter-spacing: -.02em; flex: none; }
.yo b { display: block; font-size: .98rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 180px; }
.yo small { color: var(--muted); font-size: .8rem; white-space: nowrap; display: block; }
.yo-t { min-width: 0; display: block; }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
.salir { min-height: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }

main.sec { max-width: 1180px; margin: 0 auto; padding: 22px clamp(16px, 3vw, 32px) calc(40px + env(safe-area-inset-bottom)); }
.titlebar { display: grid; gap: 4px; margin-bottom: 18px; }
.titlebar h1 { font-size: clamp(32px, 4.4vw, 46px); font-weight: 700; letter-spacing: -0.03em; line-height: 1.05; }
.titlebar p { color: var(--muted); margin: 0; font-size: 15.5px; }
.herr { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin: -4px 0 18px; }

.card { background: var(--surface); border-radius: 22px; padding: 20px 22px; }
.card + .card { margin-top: 16px; }
.card > h2 { font-size: 1.15rem; font-weight: 700; display: flex; align-items: center; gap: 10px; margin-bottom: 4px; }
.card > h2 .der { margin-left: auto; }
.card > .note { margin: 0 0 12px; }
.note { color: var(--muted); font-size: .92rem; }
.cols { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; align-items: start; }
.cols > .card + .card { margin-top: 0; }
@media (max-width: 980px) { .cols { grid-template-columns: minmax(0, 1fr); } }

/* Inicio */
.ini-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; }
.ini-card { background: var(--surface); border-radius: 22px; padding: 20px; min-width: 0; }
.ini-card.s2 { grid-column: span 2; }
.ini-card.s4 { grid-column: 1 / -1; }
.sec-h { grid-column: 1 / -1; display: flex; align-items: center; gap: 14px; margin: 22px 2px 0; font-size: .8rem; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; color: #a1a1a6; }
.sec-h:first-child { margin-top: 2px; }
.sec-h .pt { width: 8px; height: 8px; border-radius: 50%; background: var(--cat); flex: none; box-shadow: 0 0 0 4px color-mix(in srgb, var(--cat) 18%, transparent); }
.sec-h .ln { flex: 1; height: 1px; background: linear-gradient(90deg, #3a3a3c 70%, transparent); }
.cat-a { --cat: #ffcc00; } .cat-b { --cat: #2dd4bf; } .cat-c { --cat: #64d2ff; } .cat-d { --cat: #ff6961; }
.ini-grid > .ini-card { border: 1.5px solid #3a3a3c; border: 1.5px solid color-mix(in srgb, var(--cat, #3a3a3c) 55%, transparent); }
.ini-card[data-ir] { cursor: pointer; transition: background .2s, transform .15s; }
.ini-card[data-ir]:hover { background: #1f1f21; }
.ini-card[data-ir]:active { transform: scale(.985); }
.ini-top { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.ini-k { color: #d2d2d7; font-weight: 600; font-size: .95rem; }
.ibadge { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; background: #26262a; background: color-mix(in srgb, var(--c) 18%, transparent); color: var(--c); flex: none; }
.ibadge svg { width: 21px; height: 21px; }
.ini-num { font-size: 2.6rem; font-weight: 700; letter-spacing: -0.03em; line-height: 1; font-variant-numeric: tabular-nums; display: block; }
.ini-card .note { display: block; margin-top: 6px; }
.ini-hero .ini-num { color: var(--amber); }
.ini-hero .fila { display: flex; gap: 8px 20px; flex-wrap: wrap; color: #d2d2d7; margin-top: 10px; }
.ini-hero .fila b { color: var(--fg); font-variant-numeric: tabular-nums; }
.acc-grid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px; margin-top: 12px; }
.accion { display: flex; flex-direction: column; align-items: flex-start; gap: 10px; padding: 14px; border-radius: 16px; border: 0; background: #1f1f22; font-weight: 600; text-align: left; cursor: pointer; min-height: 96px; font-size: .98rem; }
.accion:hover { background: #26262a; }
.accion:active { transform: scale(.98); }
@media (max-width: 1000px) { .ini-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } .acc-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (max-width: 560px) { .ini-grid { gap: 12px; } .ini-card { padding: 16px; border-radius: 18px; } .ini-card.s2 { grid-column: 1 / -1; } .acc-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } .ini-num { font-size: 2.1rem; } }

/* Listas */
.lista { display: grid; }
.fila-l { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 4px 14px; align-items: center; padding: 14px 0; border-bottom: 1px solid var(--line); }
.fila-l:last-child { border-bottom: 0; }
.fila-l .tt { font-weight: 600; overflow-wrap: anywhere; }
.fila-l .mm { grid-column: 2 / -1; color: var(--muted); font-size: .88rem; display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: center; }
.fila-l .det { grid-column: 2 / -1; color: #d6d6da; white-space: pre-wrap; font-size: .95rem; }
.fila-l .acc { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
.fila-l .acc2 { grid-column: 2 / -1; display: flex; gap: 8px; flex-wrap: wrap; margin-top: 6px; }
.fila-l.nuevo .tt::before { content: ""; display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--amber); margin-right: 8px; vertical-align: middle; }
.fila-l.hecha .tt { color: var(--muted); }
.ico { width: 38px; height: 38px; border-radius: 11px; display: grid; place-items: center; flex: none; align-self: start; }
.ico svg { width: 21px; height: 21px; }
.c-aviso { background: #2a2405; color: var(--amber); }
.c-tarea { background: var(--info-soft); color: #7db8ec; }
.c-incid { background: var(--bad-soft); color: var(--bad); }
.c-gasto { background: #3a1a17; color: #ff7a70; }
.c-extra { background: #12301d; color: var(--ok); }
.c-corte { background: #102b2a; color: #2dd4bf; }
.c-admin { background: #26262a; color: #d2d2d7; }
.chk { width: 34px; height: 34px; border-radius: 50%; border: 2px solid #5a5a5e; background: transparent; cursor: pointer; display: grid; place-items: center; color: transparent; padding: 0; align-self: start; }
.chk svg { width: 18px; height: 18px; }
.chk:hover { border-color: var(--ok); }
.chk.on { background: var(--ok); border-color: var(--ok); color: #04210f; }
.etq { display: inline-flex; align-items: center; gap: 5px; padding: 2px 10px; border-radius: 999px; font-size: .8rem; font-weight: 600; background: #26262a; color: #d2d2d7; }
.etq svg { width: 14px; height: 14px; }
.g-leve { background: var(--info-soft); color: #7db8ec; }
.g-media { background: var(--warn-soft); color: var(--warn); }
.g-grave { background: var(--bad-soft); color: var(--bad); }
.e-ok { background: var(--ok-soft); color: var(--ok); }
.e-alta { background: var(--bad-soft); color: var(--bad); }
.e-parcial { background: var(--warn-soft); color: var(--warn); }
.nota-admin { grid-column: 2 / -1; background: #1f1f22; border-radius: 12px; padding: 10px 12px; font-size: .93rem; color: #e5e5ea; white-space: pre-wrap; }
.nota-admin b { display: block; font-size: .78rem; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; margin-bottom: 2px; }
.mov { display: flex; gap: 12px; align-items: center; padding: 11px 0; border-bottom: 1px solid var(--line); }
.mov:last-child { border-bottom: 0; }
.mov .m { margin-left: auto; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
.mov .x { border: 0; background: transparent; color: var(--muted); width: 36px; height: 36px; border-radius: 50%; cursor: pointer; display: grid; place-items: center; flex: none; }
.mov .x:hover { color: var(--bad); background: var(--bad-soft); }
.mov .x svg { width: 19px; height: 19px; }
.total { display: flex; justify-content: space-between; align-items: baseline; padding-top: 12px; margin-top: 4px; border-top: 1px solid var(--line); font-weight: 700; font-size: 1.1rem; font-variant-numeric: tabular-nums; }
.vacio { color: var(--muted); padding: 18px 0 6px; }
a.lnk, button.lnk { color: var(--amber); background: none; border: 0; padding: 0; font-weight: 600; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; min-height: 40px; }
.aviso-ok { display: flex; gap: 12px; align-items: center; background: var(--ok-soft); color: #c9f5d6; border-radius: 16px; padding: 14px 16px; margin-bottom: 16px; }
.aviso-ok svg { color: var(--ok); width: 24px; height: 24px; flex: none; }

/* Formularios */
label.campo { display: block; margin-bottom: 14px; }
label.campo > span, .campo > span.lb { display: block; font-weight: 600; margin-bottom: 6px; }
input.t, textarea.t, select.t { width: 100%; min-height: 52px; padding: 12px 14px; border-radius: 14px; border: 1px solid var(--line); background: #0d0d0e; }
textarea.t { min-height: 88px; resize: vertical; }
input.monto { font-size: 1.6rem; font-weight: 700; font-variant-numeric: tabular-nums; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chips .chip { min-height: 44px; font-size: .95rem; }
.foto { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.foto img { width: 88px; height: 88px; object-fit: cover; border-radius: 12px; border: 1px solid var(--line); }
.foto input { display: none; }

/* Cambio inicial (pantalla de entrada al turno) */
#app.sin-inicio .modulos { visibility: hidden; }
.ci { max-width: 560px; margin: 4vh auto 0; }
.ci .card { padding: 26px; }
.ci .t.monto { font-size: 2rem; font-weight: 700; text-align: center; padding: 16px; }
.ci .ref { background: #1f1f22; border-radius: 14px; padding: 12px 14px; color: #d2d2d7; margin: 0 0 14px; font-size: .95rem; }
.ci .ref b { color: var(--fg); }
/* Corte guiado por pasos */
.paso-c { border-top: 1px solid var(--line); padding-top: 18px; margin-top: 18px; }
.paso-c:first-of-type { border-top: 0; padding-top: 0; margin-top: 10px; }
.paso-c > h2 { display: flex; align-items: center; gap: 10px; font-size: 1.12rem; margin: 0 0 4px; }
.paso-c > h2 .num { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: #2a2a2d; color: var(--fg); font-size: .95rem; font-weight: 800; flex: none; }
.paso-c.listo > h2 .num { background: var(--ok); color: #0b0b0c; }
.paso-c > .guia { color: var(--muted); margin: 0 0 12px 40px; font-size: .95rem; }
.paso-c .campo { margin-left: 40px; }
@media (max-width: 560px) { .paso-c > .guia, .paso-c .campo, .paso-c .retiros-box, .paso-c .reparto, .paso-c .cuenta { margin-left: 0; } }
.cuenta { margin: 0 0 12px 40px; display: grid; gap: 6px; padding: 12px 14px; border-radius: 14px; background: #1f1f22; font-variant-numeric: tabular-nums; }
.cuenta div { display: flex; justify-content: space-between; gap: 10px; color: #d2d2d7; }
.cuenta b { color: var(--fg); }
.retiros-box { margin: 4px 0 14px 40px; border: 2px solid var(--warn); background: var(--warn-soft); border-radius: 16px; padding: 14px; }
.retiros-box .rt-h { display: flex; align-items: center; gap: 8px; font-weight: 800; color: #ffd97a; font-size: 1.05rem; }
.retiros-box .rt-h svg { width: 22px; height: 22px; color: var(--warn); }
.retiros-box p { margin: 4px 0 10px; color: #f5e3b8; font-size: .92rem; }
.retiros-box .btn { border-color: var(--warn); color: #ffd97a; }
.retiro { display: grid; grid-template-columns: minmax(0, 1fr) 140px 40px; gap: 8px; align-items: center; margin-bottom: 8px; }
.retiro .x { border: 0; background: transparent; color: var(--muted); width: 40px; height: 40px; border-radius: 50%; cursor: pointer; display: grid; place-items: center; }
.retiro .x:hover { color: var(--bad); background: var(--bad-soft); }
.retiro .x svg { width: 19px; height: 19px; }
.reparto { display: grid; gap: 4px; padding: 12px 14px; border-radius: 14px; background: #1f1f22; color: var(--muted); margin-bottom: 14px; font-variant-numeric: tabular-nums; }
.reparto b { color: var(--fg); }
.reparto.ok { background: var(--ok-soft); color: #c9f5d6; } .reparto.ok span:last-child { color: var(--ok); font-weight: 700; }

<script>
// Si la sesión de Cloudflare Access vence, las llamadas a la API reciben una redirección
// al inicio de sesión; en vez de fallar con "sin conexión", se recarga la página para entrar de nuevo.
(() => {
  const f = window.fetch.bind(window);
  let avisado = false;
  window.fetch = async (u, o = {}) => {
    const interna = typeof u === "string" && u.startsWith("/");
    const r = await f(u, interna ? { redirect: "manual", ...o } : o);
    if (interna && (r.type === "opaqueredirect" || r.status === 0) && !avisado) {
      avisado = true;
      alert("Tu sesión venció. La página se va a recargar para que vuelvas a entrar.");
      location.reload();
      throw new Error("sesion");
    }
    return r;
  };
})();
</script>

<script>
(() => {
  "use strict";
  const $ = s => document.querySelector(s);
  const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const dinero = v => "$" + Number(v || 0).toLocaleString("es-MX", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const hora = iso => iso ? new Date(iso).toLocaleTimeString("es-MX", { hour: "2-digit", minute: "2-digit", timeZone: "America/Mexico_City" }) : "";
  const fechaCorta = iso => iso ? new Date(iso).toLocaleString("es-MX", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit", timeZone: "America/Mexico_City" }) : "";
  const diaTxt = d => d ? new Date(d + "T12:00:00Z").toLocaleDateString("es-MX", { weekday: "long", day: "numeric", month: "long", timeZone: "UTC" }) : "";
  const ICONO_TURNO = { "MAÑANA": "i-sol", "TARDE": "i-tarde", "NOCHE": "i-luna" };
  const GRAV = { leve: "Leve", media: "Media", grave: "Grave" };
  const EST_INC = { abierta: "Abierta", en_proceso: "En proceso", resuelta: "Resuelta" };

  // ---- Envíos: cada uno lleva un uid (el servidor no lo registra dos veces) y, sin internet, se guarda en una cola ----
  const COLA_RUTAS = /^(inicio|gastos|extras|incidencias|avisos|corte|avisos\/[^/]+\/enterado|tareas\/[^/]+\/reporte)$/;
  const nuevoUid = () => Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 10);
  const leerLS = (k, d) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } };
  const guardarLS = (k, v) => { try { if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, JSON.stringify(v)); return true; } catch { return false; } };
  const cola = () => leerLS("turno:cola", []);
  async function api(ruta, datos, opciones = {}) {
    if (datos !== undefined && !datos.uid && ruta !== "entrar" && ruta !== "salir") datos = { ...datos, uid: nuevoUid() };
    const op = datos === undefined ? {} : { method: "POST", headers: { "Content-Type": "application/json", "X-Turno": "1" }, body: JSON.stringify(datos) };
    let r, j;
    try { r = await fetch("/turno/api/" + ruta, { credentials: "same-origin", ...op }); }
    catch {
      if (datos !== undefined && opciones.cola !== false && E && COLA_RUTAS.test(ruta)) {
        const l = cola(); l.push({ ruta, datos, persona: E.persona, at: new Date().toISOString() });
        if (!guardarLS("turno:cola", l)) throw Object.assign(new Error("Sin internet y sin espacio para guardarlo en la tablet. Intenta sin foto o espera a tener conexión."), { red: true });
        pintarRed();
        return { ok: true, enCola: true };
      }
      throw Object.assign(new Error("Sin conexión. Revisa el internet y vuelve a intentar."), { red: true });
    }
    try { j = await r.json(); } catch { j = { ok: false, error: r.status === 401 || r.status === 403 ? "La tablet perdió el acceso. Recarga la página." : "Error del servidor (" + r.status + ")." }; }
    if (j.sesion === false) { mostrarEntrada(); throw new Error(j.error); }
    if (!j.ok) throw Object.assign(new Error(j.error || "Error"), { datos: j });
    return j;
  }
  let tToast;
  function toast(msg, mal) {
    const t = $("#toast"); t.textContent = msg; t.className = mal ? "mal" : ""; t.hidden = false;
    clearTimeout(tToast); tToast = setTimeout(() => { t.hidden = true; }, mal ? 5000 : 2600);
  }

  // ======================= Entrada =======================
  let elegido = null, turnoElegido = null, pin = "";
  async function mostrarEntrada() {
    $("#app").hidden = true; $("#entrada").hidden = false;
    aplicarPrefs(null);
    elegido = null; pin = ""; pintarPin();
    $("#paso-turno").hidden = true; $("#paso-pin").hidden = true; $("#err-pin").textContent = "";
    try {
      const j = await api("personas");
      turnoElegido = j.sugerido;
      const ab = j.abierto, aviso = $("#aviso-abierto");
      aviso.hidden = !ab;
      if (ab) aviso.innerHTML = `${svg("i-alerta")}<span>Falta el corte del turno de la ${esc(TURNO_TXT[ab.turno] || ab.turno.toLowerCase())} que abrió <b>${esc(ab.persona)}</b>. Solo ${esc(ab.persona)} puede entrar para entregarlo.</span>`;
      $("#personas").innerHTML = j.personas.map(p => `<button type="button" class="persona" data-clave="${esc(p.clave)}" aria-pressed="false">${p.avatar_url ? `<img class="pfoto" src="${esc(p.avatar_url)}" alt="" width="64" height="64">` : `<span class="pfoto ini" aria-hidden="true">${esc(p.clave.slice(0, 2))}</span>`}${esc(p.clave)}${p.nombre && p.nombre !== p.clave ? `<small>${esc(p.nombre)}</small>` : ""}${p.tiene_pin ? "" : "<small>sin PIN</small>"}</button>`).join("") || `<p class="muted">No hay encargados dados de alta.</p>`;
      $("#turnos").innerHTML = j.turnos.map(t => `<button type="button" class="chip" data-turno="${t}" aria-pressed="${t === turnoElegido}"><svg class="i"><use href="#${ICONO_TURNO[t]}"/></svg>${t[0] + t.slice(1).toLowerCase()}</button>`).join("");
    } catch (e) { $("#personas").innerHTML = `<p class="err">${esc(e.message)}</p>`; }
  }
  $("#personas").addEventListener("click", e => {
    const b = e.target.closest(".persona"); if (!b) return;
    elegido = b.dataset.clave;
    document.querySelectorAll(".persona").forEach(x => x.setAttribute("aria-pressed", x === b));
    $("#paso-turno").hidden = false; $("#paso-pin").hidden = false; pin = ""; pintarPin(); $("#err-pin").textContent = "";

  });
  $("#turnos").addEventListener("click", e => {
    const b = e.target.closest(".chip"); if (!b) return;

  });

  function pintarPin() { document.querySelectorAll("#puntos i").forEach((i, n) => i.classList.toggle("on", n < pin.length)); }
  let entrando = false;
  async function teclear(k) {
    if (entrando || !elegido) return;
    if (k === "b") pin = pin.slice(0, -1); else if (k === "x") pin = ""; else if (pin.length < 4) pin += k;
    pintarPin(); $("#err-pin").textContent = "";
    if (pin.length === 4) {
      entrando = true;
      try { await api("entrar", { clave: elegido, pin, turno: turnoElegido }); pedirInicio = true; await abrirApp(); }
      catch (e) { $("#err-pin").textContent = e.message; const p = $("#puntos"); p.classList.remove("mal"); void p.offsetWidth; p.classList.add("mal"); }
      finally { pin = ""; pintarPin(); entrando = false; }

  }
  $("#teclado").addEventListener("click", e => { const b = e.target.closest("button"); if (b) teclear(b.dataset.k); });
  document.addEventListener("keydown", e => {
    if ($("#entrada").hidden) return;
    if (/^\d$/.test(e.key)) teclear(e.key); else if (e.key === "Backspace") teclear("b");
  });

  // ======================= Turno abierto =======================
  const TURNO_TXT = { "MAÑANA": "mañana", "TARDE": "tarde", "NOCHE": "noche" };
  const RES = { cumplida: ["Cumplida", "e-ok"], parcial: ["En parte", "e-parcial"], no: ["No se pudo", "e-alta"] };
  const ico = (id, cls = "") => `<span class="ico ${cls}"><svg aria-hidden="true"><use href="#${id}"/></svg></span>`;
  const svg = id => `<svg class="i" aria-hidden="true"><use href="#${id}"/></svg>`;
  const fotoLink = k => k ? `<a class="lnk" href="/turno/api/foto/${encodeURIComponent(k)}" target="_blank" rel="noopener">Ver foto</a>` : "";
  // Imagen de perfil de un encargado ("admin" = logo de la pensión). chico: para ir dentro de un texto
  const avi = (clave, chico) => `<img class="avi${chico ? " ch" : ""}" src="/turno/avatar/c/${encodeURIComponent(clave || "admin")}" alt="" width="${chico ? 22 : 40}" height="${chico ? 22 : 40}" loading="lazy">`;
  const nombreDe = clave => clave === "admin" ? "Administración" : ((E.personas.find(p => p.clave === clave) || {}).nombre || clave);
  const errores = er => er.datos && er.datos.errores ? Object.values(er.datos.errores).join(" ") : er.message;
  const sumar = l => l.reduce((s, x) => s + Number(x.monto || 0), 0);
  function paraTxt(p) {
    const t = [];
    if (p.admin) t.push("Administración");
    if (p.todos) t.push("Todos los encargados");
    for (const x of p.turnos || []) t.push("Turno " + TURNO_TXT[x]);
    for (const x of p.personas || []) t.push(x === E.persona ? "Ti" : x);

  }

  let E = null, seccion = "inicio";
  // El último estado se guarda en la tablet para poder trabajar sin internet
  let sinRed = false;
  // Versión de esta página (la pone el servidor); si en el servidor hay una nueva, se recarga sola
  const VER = "__TURNO_VER__";
  function revisarVersion() {
    if (!E || !E.ver || E.ver === VER || sucio || $("#dlg").open || seccion === "corte") return;
    let ultima = 0; try { ultima = Number(sessionStorage.getItem("turno:recarga")) || 0; } catch {}
    if (Date.now() - ultima < 120e3) return;
    try { sessionStorage.setItem("turno:recarga", String(Date.now())); } catch {}
    location.reload();
  }
  async function cargar() {
    try { E = await api("estado"); sinRed = false; guardarLS("turno:estado", { at: new Date().toISOString(), E }); setTimeout(revisarVersion, 0); }
    catch (e) {
      const g = leerLS("turno:estado", null);
      if (!e.red || !g || (E && g.E.persona !== E.persona)) throw e;
      E = g.E; sinRed = g.at;
    }

  }
  // Manda lo que quedó pendiente sin internet, en orden
  let enviando = false;
  async function enviarCola() {
    if (enviando || !E) return;
    enviando = true;
    try {
      let l = cola(), n = 0;
      while (l.length) {
        const it = l[0];

        catch (e) {
          if (e.red) break;
          if (e.datos && e.datos.sesion === false) break;

        }
        l = cola(); l.shift(); guardarLS("turno:cola", l);
      }
      if (n) { toast(`Se enviaron ${n} ${n === 1 ? "registro guardado" : "registros guardados"} sin internet.`); await refrescar().catch(() => {}); }
    } finally { enviando = false; pintarRed(); }

  function pintarRed() {
    const el = $("#red"); if (!el) return;

    // Borrador: lo escrito se guarda en la tablet y se recupera si la pantalla se redibuja o se cierra la app
    const llaveB = `turno:borrador:${E.persona}:${E.dia}:${E.turno}`;
    const b = leerLS(llaveB, null);
    if (b) for (const k of ["efectivo", "notas", "sobre", "cambio_sig"]) if (b[k] != null) f[k].value = b[k];
    $("#retiros").innerHTML = ((b && b.retiros) || (c && c.retiros) || []).map(filaRetiro).join("");

      const ef = num(f.efectivo.value), rt = retiros().reduce((a, r) => a + num(r.monto), 0);
      const rep = num(f.sobre.value) + rt + num(f.cambio_sig.value), dif = Math.round((ef - rep) * 100) / 100;

      return dif;
    }
    const cc = $("#ci-corregir"); if (cc) cc.addEventListener("click", () => verCambioInicial(true));
    $("#mas-retiro").addEventListener("click", () => { $("#retiros").insertAdjacentHTML("beforeend", filaRetiro()); $("#retiros .retiro:last-child input").focus(); });
    f.addEventListener("click", e => { const q = e.target.closest("[data-quitar-retiro]"); if (q) { q.closest(".retiro").remove(); reparto(); } });
    f.addEventListener("input", () => { reparto(); guardarLS(llaveB, { efectivo: f.efectivo.value, notas: f.notas.value, sobre: f.sobre.value, cambio_sig: f.cambio_sig.value, retiros: retiros() }); });
    reparto();
    f.addEventListener("submit", async e => {
      e.preventDefault();
      const b = f.querySelector("[type=submit]");
      const ef = num(f.efectivo.value);
      if (f.efectivo.value.trim() === "") { $("#err-corte").textContent = "Escribe el efectivo físico que contaste."; return; }
      const rts = retiros();
      if (rts.some(r => r.concepto.length < 2 || !(num(r.monto) > 0))) { $("#err-corte").textContent = "Cada retiro necesita para qué fue y el monto."; return; }
      const dif = reparto();
      const aviso = Math.abs(dif) < 0.01 ? "" : dif > 0 ? ` Ojo: faltan ${dinero(dif)} por repartir.` : ` Ojo: repartiste ${dinero(-dif)} de más.`;
      if (!(await confirmar(c ? "¿Corregir el corte?" : "¿Entregar el corte?", `Cambio inicial: ${dinero(ci || 0)}. Efectivo físico contado: ${dinero(ef)}. Sobre: ${dinero(num(f.sobre.value))}. Retiros: ${dinero(rts.reduce((a, r) => a + num(r.monto), 0))}. Cambio para el siguiente turno: ${dinero(num(f.cambio_sig.value))}.${aviso} Queda registrado a tu nombre.`, c ? "Corregir" : "Entregar"))) return;
      b.disabled = true; $("#err-corte").textContent = "";
      try {
        const r = await api("corte", { efectivo: f.efectivo.value, notas: f.notas.value, sobre: f.sobre.value, cambio_sig: f.cambio_sig.value, retiros: rts });

  // Recorta al centro en cuadrado de 320 px (JPEG) para la foto de perfil
  async function recortarPerfil(file) {
    const url = URL.createObjectURL(file);
    try {
      const img = await new Promise((ok, mal) => { const i = new Image(); i.onload = () => ok(i); i.onerror = mal; i.src = url; });
      const lado = Math.min(img.naturalWidth, img.naturalHeight), L = 320;
      const c = document.createElement("canvas"); c.width = c.height = L;
      c.getContext("2d").drawImage(img, (img.naturalWidth - lado) / 2, (img.naturalHeight - lado) / 2, lado, lado, 0, 0, L, L);
      for (const q of [0.85, 0.75, 0.6]) { const d = c.toDataURL("image/jpeg", q); if (d.length < 260_000) return d; }
      throw new Error("grande");
    } finally { URL.revokeObjectURL(url); }
  }

  const hora12 = iso => iso ? new Date(iso).toLocaleTimeString("es-MX", { hour: "numeric", minute: "2-digit", timeZone: "America/Mexico_City" }) : "";

  // ---------- Utilidades de interfaz ----------
  function elegirChip(sel, cb) {
    const cont = $(sel);
    cont.addEventListener("click", e => {
      const b = e.target.closest(".chip"); if (!b) return;
      cont.querySelectorAll(".chip").forEach(x => x.setAttribute("aria-pressed", x === b));
      cb(b.dataset.v);
    });
  }
  function activarFoto(id, cb) {
    const inp = document.getElementById(id), ver = document.getElementById(id + "-ver"), quitar = document.getElementById(id + "-quitar");
    const lbl = document.querySelector(`label[for="${id}"] span`), txt = lbl.textContent;
    inp.addEventListener("change", async () => {
      const f = inp.files && inp.files[0]; if (!f) return;
      lbl.textContent = "Preparando…";
      try { const d = await comprimir(f); cb(d); ver.src = d; ver.hidden = false; quitar.hidden = false; lbl.textContent = "Cambiar foto"; }
      catch { toast("No se pudo leer la foto. Intenta otra vez.", true); lbl.textContent = txt; }
      inp.value = "";
    });
    quitar.addEventListener("click", () => { cb(null); ver.hidden = true; ver.removeAttribute("src"); quitar.hidden = true; lbl.textContent = txt; });
  }
  // Reduce la foto a máx. 1400 px y JPEG para que suba rápido
  async function comprimir(file) {
    const url = URL.createObjectURL(file);
    try {
      const img = await new Promise((ok, mal) => { const i = new Image(); i.onload = () => ok(i); i.onerror = mal; i.src = url; });
      let lado = 1280, q = 0.72, out;
      for (let n = 0; n < 5; n++) {
        const k = Math.min(1, lado / Math.max(img.naturalWidth, img.naturalHeight));
        const c = document.createElement("canvas"); c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
        out = c.toDataURL("image/jpeg", q);
        if (out.length < 700_000) return out;
        lado *= 0.8; q = Math.max(0.55, q - 0.07);
      }
      return out;
    } finally { URL.revokeObjectURL(url); }
  }
  function confirmar(titulo, texto, si, no = "Cancelar") {
    const d = $("#dlg");
    $("#dlg-form").onsubmit = null; // la ventana se reutiliza: quitar el envío de la última hoja
    $("#dlg-form").innerHTML = `<h2>${esc(titulo)}</h2><p class="muted" style="margin:0">${esc(texto)}</p><div class="acciones"><button class="btn btn-line" value="no">${esc(no)}</button><button class="btn btn-primary" value="si">${esc(si)}</button></div>`;
    return new Promise(ok => { d.onclose = () => ok(d.returnValue === "si"); d.returnValue = ""; d.showModal(); });
  }
  // ---------- Salida ----------
  async function salir() {
    try { await api("salir", {}); } catch {}
    E = null; sec().innerHTML = ""; mostrarEntrada();
  }
  $("#terminar").addEventListener("click", async () => {
    const pend = E && !E.corte;
    if (await confirmar(pend ? "¿Salir sin entregar el corte?" : "¿Terminar turno?", pend
      ? "Puedes salir y volver después, pero nadie más podrá entrar a la tablet hasta que entregues el corte de este turno."
      : "Se cerrará tu sesión en la tablet.", pend ? "Salir" : "Terminar turno")) salir();
  });
  // Por seguridad: tras 30 minutos sin tocar la tablet se cierra la sesión
  let ultimo = Date.now(), ultRef = Date.now();
  ["pointerdown", "keydown"].forEach(ev => document.addEventListener(ev, () => { ultimo = Date.now(); }, { passive: true }));
  setInterval(() => {
    if (!E) return;
    if (Date.now() - ultimo > 30 * 60e3) { salir(); toast("Sesión cerrada por inactividad."); return; }
    // Cada minuto se actualizan avisos, tareas e incidencias si no hay un formulario a medio llenar
    const ocupado = $("#dlg").open || (document.activeElement && /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName));
    if (!ocupado && Date.now() - ultRef > 60e3) {
      ultRef = Date.now();
      enviarCola();
      // En el corte o con algo escrito sin guardar solo se actualizan los contadores (no se redibuja)
      if (seccion === "corte" || sucio) cargar().catch(() => {});
      else { const y = scrollY; refrescar().then(() => scrollTo({ top: y })).catch(() => {}); }
    }
  }, 20e3);

  // Al abrir: si ya hay sesión, directo al turno
  (async () => {
    try { await abrirApp(); } catch { mostrarEntrada(); }
  })();
})();
</script>
