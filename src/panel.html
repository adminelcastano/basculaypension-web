<!doctype html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Panel · El Castaño</title>

<link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png">
<style>
/* Panel de trabajo: barra superior, pestañas por estado, lista a la izquierda y detalle a la derecha (en celular, el detalle cubre la lista). */
:root {
  --bg: #000000; --surface: #161617; --fg: #f5f5f7; --muted: #a1a1a6; --line: #2e2e30;
  --brand: #161617; --brand-ink: #f5f5f7; --amber: #ffcc00; --amber-ink: #111111;
  --ok: #30d158; --ok-soft: #12301d; --warn-soft: #3a3010; --bad: #ff6961; --bad-soft: #3a1714; --sel: #232326;
  --font-display: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", "Segoe UI", Roboto, Arial, sans-serif;
  --font-body: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", "Segoe UI", Roboto, Arial, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 16px; line-height: 1.45; letter-spacing: -0.01em; display: flex; flex-direction: column; -webkit-font-smoothing: antialiased; }
::selection { background: var(--amber); color: var(--amber-ink); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--amber); outline-offset: 2px; border-radius: 4px; }
h1, h2, h3 { font-family: var(--font-display); margin: 0; line-height: 1.1; }

header.bar { background: rgba(22,22,23,.85); -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px); border-bottom: 1px solid rgba(255,255,255,.07); color: var(--fg); padding: 8px 16px; padding-top: calc(8px + env(safe-area-inset-top, 0px)); display: flex; align-items: center; gap: 12px; }
header.bar h1 { font-size: 1.1rem; font-weight: 600; letter-spacing: -0.015em; margin-right: auto; }
header.bar small { color: var(--muted); font-size: .8rem; }
.tools { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--line); background: var(--bg); }
.tabs { display: flex; gap: 6px; flex-wrap: wrap; }
.tab { border: 0; background: var(--surface); border-radius: 999px; padding: 7px 14px; font-weight: 500; cursor: pointer; display: inline-flex; gap: 8px; align-items: center; transition: background .2s; }
.tab[aria-selected="true"] { background: var(--fg); color: #000; }
.tab .n { font-variant-numeric: tabular-nums; font-size: .85rem; padding: 0 7px; border-radius: 999px; background: var(--amber); color: var(--amber-ink); }
.tab[aria-selected="true"] .n { background: var(--bg); color: var(--fg); }
.search { flex: 1 1 220px; min-width: 0; padding: 9px 14px; border: 0; border-radius: 10px; background: var(--surface); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 40px; padding: 0 18px; border-radius: 999px; border: 1px solid transparent; font-family: var(--font-body); font-weight: 600; font-size: .98rem; letter-spacing: -0.01em; cursor: pointer; text-decoration: none; transition: background .2s, transform .15s; }
.btn:active { transform: scale(.97); }
.btn-primary { background: var(--amber); color: var(--amber-ink); }
.btn-ok { background: var(--ok); color: #04210f; }
.btn-line { background: var(--surface); color: var(--fg); border-color: var(--line); }
.btn-bad { background: transparent; color: var(--bad); border-color: currentColor; }
.btn:disabled { opacity: .5; cursor: progress; }

main.work { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(280px, 380px) minmax(0, 1fr); }
.list { overflow-y: auto; border-right: 1px solid var(--line); background: #0b0b0c; }
.item { display: grid; gap: 2px; width: 100%; text-align: left; padding: 12px 16px; border: 0; border-bottom: 1px solid var(--line); background: transparent; cursor: pointer; }
.item:hover { background: var(--sel); }
.item[aria-current="true"] { background: var(--sel); box-shadow: inset 4px 0 0 var(--amber); }
.item .t { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item .m { color: var(--muted); font-size: .88rem; display: flex; gap: 10px; flex-wrap: wrap; }
.empty { padding: 32px 20px; color: var(--muted); }
.detail { overflow-y: auto; padding: 20px clamp(16px, 3vw, 32px) 48px; min-width: 0; }
.detail-head { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: baseline; margin-bottom: 18px; }
.detail-head h2 { font-size: 1.8rem; font-weight: 700; letter-spacing: -0.025em; }
.pill { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: .85rem; font-weight: 600; }
.pill.pendiente { background: var(--warn-soft); }
.pill.facturada { background: var(--ok-soft); color: var(--ok); }
.pill.rechazada { background: var(--bad-soft); color: var(--bad); }
.back { display: none; }
.cols { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 24px; align-items: start; }
@media (max-width: 1100px) { .cols { grid-template-columns: 1fr; } }
section.card { background: var(--surface); border: 0; border-radius: 18px; padding: 18px 20px; display: grid; gap: 12px; min-width: 0; }
section.card h3 { font-size: 1.15rem; font-weight: 600; letter-spacing: -0.015em; }
.fields { display: grid; gap: 0; }
.field { display: grid; grid-template-columns: 9.5rem minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 9px 0; border-bottom: 1px solid var(--line); }
.field:last-child { border-bottom: 0; }
.field .k { color: var(--muted); font-size: .9rem; font-weight: 600; }
.field .v { font-size: 1.05rem; font-weight: 600; overflow-wrap: anywhere; }
.field .v.vacio { color: var(--bad); font-weight: 600; font-size: .95rem; }
.copy { border: 0; background: #2a2a2d; color: #ffd60a; border-radius: 999px; padding: 5px 12px; font-size: .82rem; font-weight: 600; cursor: pointer; }
.copy.hecho { background: var(--ok-soft); color: var(--ok); }
@media (max-width: 520px) { .field { grid-template-columns: 1fr auto; } .field .k { grid-column: 1 / -1; } }
.note { color: var(--muted); font-size: .92rem; }
.warn { background: var(--warn-soft); border-radius: 8px; padding: 10px 12px; font-size: .95rem; }
.doc img { width: 100%; height: auto; border-radius: 8px; border: 1px solid var(--line); display: block; background: var(--bg); }
.doc iframe { width: 100%; height: 520px; border: 1px solid var(--line); border-radius: 8px; background: #fff; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.row input[type=text], .grid-form input, .grid-form select { padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: #0b0b0c; min-width: 0; }
.row input[type=text] { flex: 1 1 220px; }
.grid-form { display: grid; gap: 10px; grid-template-columns: 1fr 1fr; }
.grid-form label { display: grid; gap: 4px; font-size: .9rem; font-weight: 600; color: var(--muted); }
.grid-form label.marcado { color: var(--amber); }
.grid-form label.marcado input { border-color: var(--amber); box-shadow: 0 0 0 1px var(--amber); }
.grid-form .wide { grid-column: 1 / -1; }
@media (max-width: 520px) { .grid-form { grid-template-columns: 1fr; } }
.export { position: relative; }
.export summary { list-style: none; }
.export summary::-webkit-details-marker { display: none; }
.export-box { position: absolute; right: 0; top: calc(100% + 8px); z-index: 20; width: min(320px, calc(100vw - 32px)); background: #1d1d1f; border: 1px solid var(--line); border-radius: 16px; padding: 14px; display: grid; gap: 10px; box-shadow: 0 16px 36px -18px rgba(0,0,0,.45); }
.export-box label { display: grid; gap: 4px; font-size: .9rem; font-weight: 600; color: var(--muted); }
.export-box input, .export-box select { padding: 8px 10px; border: 1px solid var(--line); border-radius: 10px; background: #0b0b0c; }
@media (max-width: 600px) { .export-box { left: 0; right: auto; } }
.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: rgba(245,245,247,.95); color: #000; padding: 10px 18px; border-radius: 999px; font-weight: 600; opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 50; }
.toast.on { opacity: 1; }

@media (max-width: 820px) {
  main.work { grid-template-columns: 1fr; }
  .list { border-right: 0; }
  .detail { display: none; }
  main.work.ver-detalle .list { display: none; }
  main.work.ver-detalle .detail { display: block; }
  .back { display: inline-flex; }
}

/* ---- Igual que la página: título grande, control segmentado, listas tipo iOS, movimiento suave ---- */
body { font-size: 17px; }
header.bar { position: sticky; top: 0; z-index: 30; height: 52px; }
header.bar h1 { font-size: 15px; }
.titlebar { padding: 22px clamp(16px, 3vw, 32px) 4px; display: grid; gap: 4px; }
.titlebar h2 { font-size: clamp(34px, 4.6vw, 48px); font-weight: 700; letter-spacing: -0.03em; line-height: 1.05; }
.titlebar .note { font-size: 15px; }
.tools { border-bottom: 0; padding: 14px clamp(16px, 3vw, 32px) 16px; }
.tabs { background: var(--surface); padding: 3px; border-radius: 12px; gap: 2px; flex-wrap: nowrap; }
.tab { background: transparent; border-radius: 9px; padding: 7px 14px; font-size: 14.5px; color: #d2d2d7; }
.tab:hover { color: #fff; }
.tab[aria-selected="true"] { background: #3a3a3c; color: #fff; box-shadow: 0 2px 8px rgba(0,0,0,.35); }
.tab[aria-selected="true"] .n { background: var(--amber); color: var(--amber-ink); }
.tab .ti { display: none; width: 24px; height: 24px; }
.search { border-radius: 12px; padding: 10px 14px; }
main.work { border-top: 1px solid var(--line); }
.list { background: var(--bg); padding: 12px; display: block; }
.item { position: relative; background: var(--surface); border: 0; border-radius: 0; padding: 14px 40px 14px 16px; transition: background .2s; }
.item + .item { box-shadow: inset 0 1px 0 var(--line); }
.list > .item:first-of-type, .list > p + .item { border-top-left-radius: 14px; border-top-right-radius: 14px; }
.list > .item:last-of-type { border-bottom-left-radius: 14px; border-bottom-right-radius: 14px; }
.item:hover { background: #1f1f21; }
.item[aria-current="true"] { background: #2a2a2d; box-shadow: none; }
.item .chev { position: absolute; right: 14px; top: 50%; width: 16px; height: 16px; margin-top: -8px; color: #5a5a5e; }
.item .t { font-size: 16px; }
.item { padding-left: 62px; }
.svc { display: inline-grid; place-items: center; width: 34px; height: 34px; border-radius: 9px; flex: none; }
.svc svg { width: 21px; height: 21px; }
.svc.bascula { background: #3a3010; color: var(--amber); }
.svc.pension { background: #102a3a; color: #64d2ff; }
.svc.ambos { background: #26262a; color: #c7c7cc; }
.item > .svc { position: absolute; left: 14px; top: 14px; }
.svc-tag { display: inline-flex; align-items: center; gap: 8px; font-weight: 600; }
.svc-tag .svc { width: 28px; height: 28px; border-radius: 8px; }
.svc-tag .svc svg { width: 18px; height: 18px; }
.list > .note { padding: 4px 6px 12px !important; border: 0 !important; }
.detail { padding-top: 16px; }
.detail-head h2 { font-size: clamp(28px, 3.4vw, 40px); letter-spacing: -0.03em; }
section.card { border-radius: 22px; padding: 22px 24px; }
.btn-bad { border-color: transparent; background: var(--bad-soft); }
.btn-bad.armed { background: var(--bad); color: #fff; }
.pill.pendiente { background: #3a3010; color: #ffd60a; }
@media (prefers-reduced-motion: no-preference) {
  .detail.entra .cols > div > section, .detail.entra .detail-head { animation: subir .6s cubic-bezier(.16,1,.3,1) both; }
  .detail.entra .cols > div > section:nth-child(2) { animation-delay: .05s; }
  .detail.entra .cols > div > section:nth-child(3) { animation-delay: .1s; }
  .detail.entra .cols > div > section:nth-child(4) { animation-delay: .15s; }
  .list .item { animation: aparecer .45s ease both; }
  @keyframes subir { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  @keyframes aparecer { from { opacity: 0; } to { opacity: 1; } }
  @media (max-width: 820px) { main.work.ver-detalle .detail { animation: empujar .38s cubic-bezier(.16,1,.3,1) both; } @keyframes empujar { from { transform: translateX(24px); opacity: .4; } to { transform: none; opacity: 1; } } }
}
/* Celular: las pestañas pasan abajo como barra de pestañas de iOS */
@media (max-width: 820px) {
  .tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; border-radius: 0; padding: 6px 6px calc(6px + env(safe-area-inset-bottom, 0px));
    background: rgba(22,22,23,.85); -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px); border-top: 1px solid rgba(255,255,255,.08);
    display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .tab { flex-direction: column; gap: 2px; padding: 4px 2px; font-size: 11px; position: relative; color: #8e8e93; }
  .tab[aria-selected="true"] { background: transparent; box-shadow: none; color: var(--amber); }
  .tab .ti { display: block; }
  .tab .n { position: absolute; top: 0; left: calc(50% + 6px); font-size: 11px; padding: 0 5px; min-width: 18px; }
  .tab:not([aria-selected="true"]) .n { background: #ff453a; color: #fff; }
  main.work { border-top: 0; }
  .detail, .list { padding-bottom: calc(90px + env(safe-area-inset-bottom, 0px)); }
  .tools { padding-top: 8px; }
}

/* Deslizar para eliminar */
.swipe { position: relative; overflow: hidden; background: #ff3b30; transition: height .3s cubic-bezier(.16,1,.3,1); }
.swipe + .swipe .item, .swipe + .swipe { box-shadow: none; }
.swipe + .swipe { border-top: 1px solid var(--line); }
.list > .swipe:first-of-type { border-top-left-radius: 14px; border-top-right-radius: 14px; }
.list > .swipe:last-of-type { border-bottom-left-radius: 14px; border-bottom-right-radius: 14px; }
.swipe .item { border-radius: 0 !important; touch-action: pan-y; user-select: none; -webkit-user-select: none; will-change: transform; position: relative; z-index: 1; }
.swipe-bg { position: absolute; inset: 0; display: flex; align-items: center; gap: 7px; padding-left: 18px; color: #fff; font-weight: 600; font-size: 15px; }
.swipe-bg .ti { width: 22px; height: 22px; transition: transform .2s; }
.swipe.listo .swipe-bg .ti { transform: scale(1.25); }
.swipe-del { position: absolute; left: 0; top: 0; bottom: 0; width: 116px; z-index: 0; border: 0; background: transparent; color: transparent; cursor: pointer; }
.swipe.abierto .swipe-del { z-index: 2; }
.swipe.colapsa { border-top-color: transparent; }
.undo { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(24px + env(safe-area-inset-bottom, 0px)); z-index: 60; display: flex; align-items: center; gap: 18px; padding: 10px 10px 10px 20px; border-radius: 999px; background: rgba(44,44,46,.96); -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px); box-shadow: 0 12px 30px -10px rgba(0,0,0,.7); font-weight: 500; max-width: calc(100vw - 32px); }
.undo span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.undo button { border: 0; background: var(--amber); color: var(--amber-ink); font-weight: 700; border-radius: 999px; padding: 8px 16px; cursor: pointer; flex: none; }
@media (max-width: 820px) { .undo { bottom: calc(88px + env(safe-area-inset-bottom, 0px)); } }

/* Visor de PDF: un solo documento con sus páginas dentro de un marco desplazable */
.pdfview { background: #2a2a2d; border-radius: 14px; overflow: hidden; display: flex; flex-direction: column; }
.pdfview .pdf-bar { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 9px 14px; font-size: 13px; color: var(--muted); border-bottom: 1px solid rgba(255,255,255,.06); background: #232325; }
.pdfview .pdf-bar b { color: var(--fg); font-weight: 600; }
.pdfview .pdf-pages { position: relative; max-height: min(72vh, 760px); overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 6px; overscroll-behavior: contain; }
.pdfview canvas { width: 100%; height: auto; display: block; background: #fff; border-radius: 2px; }
.pdfview > .note { padding: 16px; }

/* ---- Secciones del panel: Facturación y Personal ---- */
.mod { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.modulos { display: flex; gap: 2px; background: #2a2a2d; padding: 3px; border-radius: 10px; }
.modulos button { border: 0; background: transparent; color: #d2d2d7; font-weight: 600; font-size: 13.5px; letter-spacing: .02em; text-transform: uppercase; padding: 6px 14px; border-radius: 8px; cursor: pointer; }
.modulos button[aria-current="page"] { background: var(--amber); color: var(--amber-ink); }
header.bar h1 { margin-right: 0; }
header.bar .modulos { margin-right: auto; margin-left: 8px; }
@media (max-width: 640px) { header.bar small { display: none; } header.bar h1 { display: none; } header.bar .modulos { margin-left: auto; } }

/* Personal */
.folio { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .82rem; letter-spacing: .02em; color: var(--amber); }
.folio-tag { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .9rem; padding: 3px 10px; border-radius: 8px; background: #2a2a2d; color: var(--amber); border: 0; cursor: pointer; }
.ptipo .ptab[aria-selected="true"] { background: var(--amber); color: var(--amber-ink); }
.ptipo .ptab[aria-selected="true"] .n { background: rgba(0,0,0,.18); color: var(--amber-ink); }
.plim { flex-basis: 100%; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.plim label { display: inline-flex; align-items: center; gap: 8px; font-size: .9rem; font-weight: 600; color: var(--muted); }
.plim input { padding: 8px 10px; border: 1px solid var(--line); border-radius: 10px; background: #0b0b0c; }
.adocs { display: grid; gap: 0; }
.adoc { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
.adoc:last-child { border-bottom: 0; }
.adoc b { font-weight: 600; overflow-wrap: anywhere; }
.adoc .note { font-size: .85rem; grid-column: 1; }
.adoc .acc { grid-row: 1 / span 2; grid-column: 2; display: flex; gap: 6px; }
.adoc .acc a, .adoc .acc button { text-decoration: none; }
.archivo-sel { position: relative; overflow: hidden; }
.archivo-sel input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
.ptabs { display: flex; background: var(--surface); padding: 3px; border-radius: 12px; gap: 2px; }
.ptab { border: 0; background: transparent; border-radius: 9px; padding: 7px 14px; font-size: 14.5px; font-weight: 500; color: #d2d2d7; cursor: pointer; display: inline-flex; gap: 8px; align-items: center; }
.ptab[aria-selected="true"] { background: #3a3a3c; color: #fff; box-shadow: 0 2px 8px rgba(0,0,0,.35); }
.ptab .n { font-variant-numeric: tabular-nums; font-size: .85rem; padding: 0 7px; border-radius: 999px; background: #3a3a3c; color: var(--fg); }
.ptab[aria-selected="true"] .n { background: var(--amber); color: var(--amber-ink); }
.pitem { position: relative; display: grid; gap: 4px; width: 100%; text-align: left; background: var(--surface); border: 0; padding: 14px 40px 14px 16px; cursor: pointer; transition: background .2s; }
.pitem + .pitem { box-shadow: inset 0 1px 0 var(--line); }
.list > .pitem:first-of-type { border-top-left-radius: 14px; border-top-right-radius: 14px; }
.list > .pitem:last-of-type { border-bottom-left-radius: 14px; border-bottom-right-radius: 14px; }
.pitem:hover { background: #1f1f21; }
.pitem[aria-current="true"] { background: #2a2a2d; }
.pitem .t { font-weight: 600; font-size: 16px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pitem .m { color: var(--muted); font-size: .88rem; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.pitem .chev { position: absolute; right: 14px; top: 50%; width: 16px; height: 16px; margin-top: -8px; color: #5a5a5e; }
.est { display: inline-grid; place-items: center; width: 34px; height: 34px; border-radius: 9px; flex: none; }
.est svg { width: 21px; height: 21px; }
.est.activo { background: var(--ok-soft); color: var(--ok); }
.est.inactivo { background: #3a3a3c; color: #aeaeb2; }
.est.sm { width: 24px; height: 24px; border-radius: 7px; }
.est.sm svg { width: 16px; height: 16px; }
.pitem { padding-left: 62px; }
.pitem > .est { position: absolute; left: 14px; top: 14px; }
.pitem.baja .t { color: var(--muted); }
#p-detalle .detail-head { align-items: center; }
.pill.inactivo { background: #2a2a2d; color: #c7c7cc; }
.estatus-box { display: flex; align-items: center; gap: 12px; }
.estatus-box .est { width: 44px; height: 44px; border-radius: 12px; }
.estatus-box .est svg { width: 26px; height: 26px; }
.estatus-box b { font-size: 1.15rem; display: block; }
.mini { display: inline-block; width: 64px; height: 6px; border-radius: 999px; background: #2a2a2d; overflow: hidden; vertical-align: middle; }
.mini i { display: block; height: 100%; background: var(--amber); }
.mini.ok i { background: var(--ok); }
.pill.completo { background: var(--ok-soft); color: var(--ok); }
.pill.faltan { background: #3a3010; color: #ffd60a; }
.pill.sinllenar { background: #3a3a3c; color: #e5e5ea; }
.checklist { display: grid; gap: 0; }
.chk { display: grid; grid-template-columns: 30px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 11px 0; border-bottom: 1px solid var(--line); cursor: pointer; }
.chk:last-child { border-bottom: 0; }
.chkrow { border-bottom: 1px solid var(--line); }
.chkrow:last-child { border-bottom: 0; }
.chkrow .chk { border-bottom: 0; }
.chkrow .fotos { display: flex; gap: 8px; flex-wrap: wrap; padding: 0 0 11px 42px; margin-top: -4px; }
.chkrow .fotos a { text-decoration: none; }
.chk input { width: 24px; height: 24px; margin: 0; accent-color: var(--ok); cursor: pointer; }
.chk b { font-weight: 600; font-size: 1.02rem; }
.chk.ok b { color: var(--muted); text-decoration: line-through; text-decoration-color: #5a5a5e; }
.chk .note { font-size: .85rem; white-space: nowrap; }
.barra { height: 8px; background: #2a2a2d; border-radius: 999px; overflow: hidden; }
.barra i { display: block; height: 100%; background: var(--amber); border-radius: 999px; transition: width .35s; }
.barra.ok i { background: var(--ok); }
.enlace { padding: 10px 12px; border-radius: 10px; background: #0b0b0c; border: 1px solid var(--line); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .85rem; overflow-wrap: anywhere; user-select: all; }
.grid-form textarea { padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: #0b0b0c; min-height: 110px; resize: vertical; }
.grid-form .sep { grid-column: 1 / -1; color: var(--fg); font-weight: 700; font-size: .95rem; margin-top: 8px; padding-top: 10px; border-top: 1px solid var(--line); }
.grid-form .err { color: var(--bad); font-size: .82rem; }
.grid-form .err:empty { display: none; }
@media (max-width: 820px) { #mod-personal .detail, #mod-personal .list { padding-bottom: calc(24px + env(safe-area-inset-bottom, 0px)); } }
</style>
</head>
<body>
<header class="bar">
  <img src="/img/logo.png" alt="" width="167" height="229" style="height:32px;width:auto;display:block">
  <h1>El Castaño</h1>
  <nav class="modulos" aria-label="Sección">
    <button type="button" data-mod="facturacion" aria-current="page">Facturación</button>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-inbox" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" d="M3.6 13.2l2.6-7.4a1.6 1.6 0 0 1 1.5-1.1h8.6a1.6 1.6 0 0 1 1.5 1.1l2.6 7.4v4.6a1.6 1.6 0 0 1-1.6 1.6H5.2a1.6 1.6 0 0 1-1.6-1.6z"/><path fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" d="M3.8 13.2h4.4l1.4 2.4h4.8l1.4-2.4h4.4"/></symbol>
  <symbol id="i-ok" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.6" fill="none" stroke="currentColor" stroke-width="1.7"/><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M8.2 12.3l2.6 2.6 5-5.2"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.6" fill="none" stroke="currentColor" stroke-width="1.7"/><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" d="M9.2 9.2l5.6 5.6M14.8 9.2l-5.6 5.6"/></symbol>
  <symbol id="i-arch" viewBox="0 0 24 24"><rect x="3.4" y="4.4" width="17.2" height="4.4" rx="1.4" fill="none" stroke="currentColor" stroke-width="1.7"/><path fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" d="M5 8.8v9.4a1.6 1.6 0 0 0 1.6 1.6h10.8a1.6 1.6 0 0 0 1.6-1.6V8.8M10 12.6h4"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M4.6 6.6h14.8M9.6 6.4V4.8a1.2 1.2 0 0 1 1.2-1.2h2.4a1.2 1.2 0 0 1 1.2 1.2v1.6M6.6 6.6l.9 12.2a1.6 1.6 0 0 0 1.6 1.5h5.8a1.6 1.6 0 0 0 1.6-1.5l.9-12.2M10.2 10.6v5.8M13.8 10.6v5.8"/></symbol>
  <symbol id="i-bascula" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M9.4 7.2a2.6 2.6 0 1 1 5.2 0M7.4 7.2h9.2l2.6 12.2H4.8z"/><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" d="M9.6 15.6v-4l2.4 2.6 2.4-2.6v4"/></symbol>
  <symbol id="i-pension" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M2.8 6.4h10.6v9.8H2.8zM13.4 9.6h4.2l3.2 3.4v3.2h-7.4"/><circle cx="6.6" cy="17.4" r="1.8" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="17" cy="17.4" r="1.8" fill="none" stroke="currentColor" stroke-width="1.8"/></symbol>
  <symbol id="i-activo" viewBox="0 0 24 24"><circle cx="10" cy="8" r="3.6" fill="none" stroke="currentColor" stroke-width="1.8"/><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" d="M3.6 19.6c.6-3.4 3.2-5.4 6.4-5.4 1.3 0 2.5.3 3.5.9"/><path fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" d="M15 17.4l2.2 2.2 4-4.2"/></symbol>
  <symbol id="i-inactivo" viewBox="0 0 24 24"><circle cx="10" cy="8" r="3.6" fill="none" stroke="currentColor" stroke-width="1.8"/><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" d="M3.6 19.6c.6-3.4 3.2-5.4 6.4-5.4 1.3 0 2.5.3 3.5.9"/><path fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" d="M15.4 17.6h5.4"/></symbol>
  <symbol id="i-chev" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M9.5 6l6 6-6 6"/></symbol>
</svg>

<div class="titlebar">

</div>
<div class="tools">
  <div class="tabs" role="tablist" aria-label="Estado">
    <button class="tab" role="tab" data-estado="pendiente" aria-selected="true"><svg class="ti" aria-hidden="true"><use href="#i-inbox"/></svg><span class="tl">Pendientes</span> <span class="n" id="n-pendiente">0</span></button>
    <button class="tab" role="tab" data-estado="facturada" aria-selected="false"><svg class="ti" aria-hidden="true"><use href="#i-ok"/></svg><span class="tl">Facturadas</span> <span class="n" id="n-facturada">0</span></button>
    <button class="tab" role="tab" data-estado="rechazada" aria-selected="false"><svg class="ti" aria-hidden="true"><use href="#i-x"/></svg><span class="tl">Rechazadas</span> <span class="n" id="n-rechazada">0</span></button>
    <button class="tab" role="tab" data-estado="historico" aria-selected="false"><svg class="ti" aria-hidden="true"><use href="#i-arch"/></svg><span class="tl">Histórico</span> <span class="n" id="n-historico">0</span></button>
  </div>
  <input class="search" id="q" type="search" placeholder="Buscar por RFC, nombre, correo o folio" aria-label="Buscar">
  <button class="btn btn-line" id="recargar" type="button">Actualizar</button>
  <details class="export">
    <summary class="btn btn-line">Exportar a Excel</summary>
    <div class="export-box">
      <label>Mes<input type="month" id="exp-mes"></label>
      <label>Estado<select id="exp-estado"><option value="facturada">Facturadas</option><option value="pendiente">Pendientes</option><option value="rechazada">Rechazadas</option><option value="historico">Histórico</option><option value="todas">Todas</option></select></label>
      <a class="btn btn-primary" id="exp-ir" href="#">Descargar</a>

<main class="work" id="work">

  <h2 id="p-titulo">Personal.</h2>

</div>
<div class="tools">
  <div class="ptabs ptipo" role="tablist" aria-label="Grupo">
    <button class="ptab" role="tab" data-tipo="colaborador" aria-selected="true">Colaboradores <span class="n" id="pn-colaborador">0</span></button>

    <button class="ptab" role="tab" data-estatus="activo" aria-selected="true"><span class="est activo sm"><svg aria-hidden="true"><use href="#i-activo"/></svg></span>Activos <span class="n" id="pn-activo">0</span></button>
    <button class="ptab" role="tab" data-estatus="inactivo" aria-selected="false"><span class="est inactivo sm"><svg aria-hidden="true"><use href="#i-inactivo"/></svg></span>Inactivos <span class="n" id="pn-inactivo">0</span></button>
  </div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="undo" id="undo" role="status" aria-live="polite" hidden><span id="undo-txt">Solicitud eliminada</span><button type="button" id="undo-btn">Deshacer</button></div>

<script>
(() => {
  const $ = (s, el = document) => el.querySelector(s);
  const estadoState = { estado: "pendiente", q: "", actual: null, cat: null };
  const fmt = new Intl.DateTimeFormat("es-MX", { timeZone: "America/Mexico_City", dateStyle: "medium", timeStyle: "short" });
  const fecha = iso => iso ? fmt.format(new Date(iso)) : "";
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  const SERVICIO_ICONO = { bascula: ["i-bascula", "Báscula"], pension: ["i-pension", "Pensión"], ambos: ["i-bascula", "Báscula y pensión"] };
  const iconoServicio = servicio => {
    const [ico, nombre] = SERVICIO_ICONO[servicio] || ["i-inbox", servicio || "Servicio"];
    return `<span class="svc ${esc(servicio || "")}" title="${esc(nombre)}" role="img" aria-label="${esc(nombre)}"><svg aria-hidden="true"><use href="#${ico}"/></svg></span>`;
  };
  const dinero = v => "$" + Number(v).toLocaleString("es-MX", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  function mensajeCliente(s, servicios) {
    const concepto = { bascula: "servicio de báscula", pension: "servicio de pensión", ambos: "servicios de báscula y pensión" }[s.servicio] || "servicio";
    const unidad = [s.descripcion, s.placas ? `placas ${s.placas}` : ""].filter(Boolean).join(", ");
    const ticket = (s.folio_ticket ? `tu ticket ${s.folio_ticket}` : "tu ticket") + (unidad ? ` (${unidad})` : "");
    const importe = s.importe ? ` por ${dinero(s.importe)}` : "";
    if (s.estado === "facturada") {
      return `Hola, te saluda Báscula y Pensión El Castaño. Te confirmamos que ${ticket}${importe} por concepto de ${concepto} quedó facturado con el número de factura ${s.folio_factura}. Te la enviamos a tu correo ${s.email}. Gracias por tu preferencia.`;
    }
    if (s.estado === "rechazada") {
      return `Hola, te saluda Báscula y Pensión El Castaño. No pudimos emitir la factura de tu solicitud ${s.folio}${s.folio_ticket ? ` (ticket ${s.folio_ticket})` : ""}: ${s.motivo || ""}. Puedes enviar tus datos de nuevo aquí:\nhttps://basculaypension.com/factura`;
    }
    return `Hola, te saluda Báscula y Pensión El Castaño. Recibimos tu solicitud de factura ${s.folio}${s.folio_ticket ? ` del ticket ${s.folio_ticket}` : ""}${importe} por concepto de ${concepto}. La estamos procesando y te la enviaremos a tu correo ${s.email}.`;
  }

  function toast(msg) { const t = $("#toast"); t.textContent = msg; t.classList.add("on"); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("on"), 2200); }

  async function api(ruta, opciones = {}) {
    const r = await fetch("/panel/api/" + ruta, { ...opciones, headers: { "X-Panel": "1", ...(opciones.body ? { "Content-Type": "application/json" } : {}) } });
    if (r.status === 401 || r.status === 403) { toast("Tu sesión expiró. Recarga la página."); throw new Error("sesion"); }
    const j = await r.json().catch(() => ({ ok: false, error: "Respuesta inválida del servidor." }));
    if (!j.ok) throw new Error(j.error || "Error");
    return j;
  }

  async function cargarLista() {
    const p = new URLSearchParams({ estado: estadoState.estado });
    if (estadoState.q) p.set("q", estadoState.q);
    const lista = $("#lista");
    try {
      const j = await api("solicitudes?" + p);
      for (const e of ["pendiente", "facturada", "rechazada", "historico"]) { const n = j.conteos[e] || 0; $("#n-" + e).textContent = n; $("#n-" + e).hidden = !n; }
      const dias = j.dias_retencion || 90;
      const nombres = { pendiente: "Pendientes.", facturada: "Facturadas.", rechazada: "Rechazadas.", historico: "Histórico." };
      const subt = { pendiente: "Por facturar, de la más antigua a la más reciente.", facturada: "Resueltas en los últimos 7 días.", rechazada: "Rechazadas en los últimos 7 días. Desliza una a la derecha para eliminarla.", historico: `Se eliminan ${dias} días después de resolverse, con respaldo a tu correo.` };
      $("#titulo").textContent = nombres[estadoState.estado];
      $("#subtitulo").textContent = `${j.conteos[estadoState.estado] || 0} · ${subt[estadoState.estado]}`;
      if (!j.solicitudes.length) {
        lista.innerHTML = `<p class="empty">${estadoState.q ? "Sin resultados para esa búsqueda." : { pendiente: "No hay solicitudes pendientes. Las nuevas aparecen aquí.", facturada: "Las facturadas de los últimos 7 días aparecen aquí; las anteriores pasan a Histórico.", rechazada: "Las rechazadas de los últimos 7 días aparecen aquí; las anteriores pasan a Histórico.", historico: "Todavía no hay solicitudes en el histórico." }[estadoState.estado]}</p>`;
        return;
      }
      const restan = iso => Math.max(0, Math.ceil(dias - (Date.now() - new Date(iso).getTime()) / 86400e3));
      const aviso = estadoState.estado === "historico" ? `<p class="note" style="padding:10px 16px;margin:0;border-bottom:1px solid var(--line)">Se eliminan ${dias} días después de facturar o rechazar. Antes te llega un respaldo en Excel a tu correo.</p>` : "";
      const deslizable = estadoState.estado === "rechazada";
      lista.innerHTML = aviso + j.solicitudes.filter(s => !borrandoIds.has(s.id)).map(s => `${deslizable ? `<div class="swipe" data-id="${s.id}"><div class="swipe-bg" aria-hidden="true"><svg class="ti"><use href="#i-trash"/></svg><span>Eliminar</span></div><button class="swipe-del" type="button" tabindex="-1" data-del="${s.id}">Eliminar</button>` : ""}
        <button class="item" data-id="${s.id}" ${estadoState.actual === s.id ? 'aria-current="true"' : ""}>
          <svg class="chev" aria-hidden="true"><use href="#i-chev"/></svg>
          ${iconoServicio(s.servicio)}
          <span class="t">${esc(s.nombre || (s.modo === "csf" ? "Constancia por revisar" : "Sin nombre"))}</span>
          <span class="m"><span>${esc(s.rfc || "RFC por revisar")}</span><span>${esc(s.folio)}</span></span>
          <span class="m"><span>${fecha(s.estado === "pendiente" ? s.creado : s.resuelta_en)}</span>${s.folio_factura ? `<span>Factura ${esc(s.folio_factura)}</span>` : ""}${estadoState.estado === "historico" ? `<span>${s.estado === "rechazada" ? "Rechazada · " : ""}se borra en ${restan(s.resuelta_en)} días</span>` : ""}</span>
        </button>${deslizable ? "</div>" : ""}`).join("");
    } catch (e) { if (e.message !== "sesion") lista.innerHTML = `<p class="empty">No se pudo cargar la lista: ${esc(e.message)}</p>`; }
  }

  function campo(etiqueta, valor, copiable = true) {
    const vacio = !valor;
    return `<div class="field"><span class="k">${etiqueta}</span><span class="v ${vacio ? "vacio" : ""}">${vacio ? "Falta" : esc(valor)}</span>${copiable && !vacio ? `<button class="copy" data-copy="${esc(valor)}" type="button">Copiar</button>` : "<span></span>"}</div>`;
  }

  async function abrir(id) {
    estadoState.actual = id;
    document.querySelectorAll(".item").forEach(b => b.toggleAttribute("aria-current", b.dataset.id === id));
    $("#work").classList.add("ver-detalle");
    const d = $("#detalle");
    d.innerHTML = `<p class="empty">Cargando…</p>`;
    let j;
    try { j = await api("solicitudes/" + id); } catch (e) { d.innerHTML = `<p class="empty">${esc(e.message)}</p>`; return; }
    const s = j.solicitud; estadoState.cat = j;
    const reg = s.regimen ? `${s.regimen} · ${j.regimenes[s.regimen] || ""}` : "";
    const uso = s.uso ? `${s.uso} · ${j.usos[s.uso] || ""}` : "";
    const tel = s.telefono ? `52${s.telefono}` : "";
    const archivo = tipo => `/panel/api/solicitudes/${s.id}/archivo/${tipo}`;
    const docHtml = (tipo, mime, titulo) => {
      if (s.archivos_borrados) return `<p class="note">El archivo se borró automáticamente ${90} días después de resolver la solicitud.</p>`;
      if (mime === "application/pdf") return `<div class="pdfview" data-pdf="${tipo}" aria-label="${titulo}"><p class="note">Cargando documento…</p></div><div class="row"><a class="btn btn-line" href="${archivo(tipo)}" target="_blank" rel="noopener">Abrir PDF completo</a></div>`;
      return `<a href="${archivo(tipo)}" target="_blank" rel="noopener"><img src="${archivo(tipo)}" alt="${titulo}" loading="lazy"></a>`;
    };
    const faltan = !s.rfc || !s.nombre || !s.regimen || !s.cp;
    const esBascula = s.servicio === "bascula";

    d.innerHTML = `
      <button class="btn btn-line back" id="volver" type="button">← Volver a la lista</button>
      <div class="detail-head">
        <h2>${esc(s.nombre || "Solicitud " + s.folio)}</h2>
        <span class="svc-tag">${iconoServicio(s.servicio)}${esc(j.servicios[s.servicio] || s.servicio || "")}</span>
        <span class="pill ${s.estado}">${{ pendiente: "Pendiente", facturada: "Facturada", rechazada: "Rechazada" }[s.estado]}</span>
        <span class="note">Folio ${esc(s.folio)} · recibida ${fecha(s.creado)}</span>
      </div>
      <div class="cols">
        <div style="display:grid;gap:20px;min-width:0">
          <section class="card">
            <h3>Datos para Facturador</h3>
            ${s.modo === "csf" && !s.datos_de_csf && faltan ? `<p class="warn">El cliente envió su constancia. Los datos se leen solos del PDF; si es una foto o un escaneo, captúralos abajo viendo el documento.</p>` : ""}
            ${s.datos_de_csf ? `<p class="note">Datos tomados de la constancia. Verifícalos contra el documento.</p>` : ""}
            <div class="fields">
              ${campo("RFC", s.rfc)}
              ${campo("Nombre o razón social", s.nombre)}
              ${campo("Código postal", s.cp)}
              ${campo("Régimen fiscal", reg)}
              ${campo("Uso del CFDI", uso)}
              ${campo("Correo", s.email)}
            </div>
          </section>
          <section class="card">
            <h3>Ticket y contacto</h3>
            <div class="fields">
              ${s.comentario ? campo("Comentario del cliente", s.comentario, false) : ""}
            </div>
            ${(j.duplicados || []).length ? `<p class="warn"><b>Ojo: el ticket ${esc(s.folio_ticket)} ya aparece en otra solicitud.</b> ${j.duplicados.map(x => `${esc(x.folio)} (${{ pendiente: "pendiente", facturada: "facturada" + (x.folio_factura ? " con factura " + esc(x.folio_factura) : ""), rechazada: "rechazada" }[x.estado] || esc(x.estado)})`).join(", ")}. Revisa que no se facture dos veces.</p>` : ""}

  // Lectura de la Constancia de Situación Fiscal (PDF del SAT) en el navegador
  let pdfjsListo = null;
  function cargarPdfjs() {
    if (pdfjsListo) return pdfjsListo;
    pdfjsListo = new Promise((res, rej) => {
      const s = document.createElement("script");
      s.src = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js";
      s.onload = async () => {
        // El worker se carga como blob del mismo sitio para que funcione en todos los navegadores
        try {
          const codigo = await (await fetch("https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js")).text();
          window.pdfjsLib.GlobalWorkerOptions.workerSrc = URL.createObjectURL(new Blob([codigo], { type: "text/javascript" }));
        } catch { window.pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"; }
        res(window.pdfjsLib);
      };
      s.onerror = () => rej(new Error("No se pudo cargar el lector de PDF"));
      document.head.appendChild(s);
    });
    return pdfjsListo;
  }


  // Documentos PDF: se descargan una vez y se dibujan en el panel (funciona en celular y computadora)
  const cachePdf = new Map();
  async function obtenerPdf(url) {
    if (!cachePdf.has(url)) cachePdf.set(url, (async () => {
      const pdfjs = await cargarPdfjs();
      const r = await fetch(url);
      if (!r.ok) throw new Error(r.status === 404 ? "El archivo ya no está disponible." : "No se pudo descargar el archivo.");
      return pdfjs.getDocument({ data: await r.arrayBuffer() }).promise;
    })());
    try { return await cachePdf.get(url); } catch (e) { cachePdf.delete(url); throw e; }
  }
  async function mostrarPdf(contenedor, url, id) {
    try {
      const pdf = await obtenerPdf(url);
      if (estadoState.actual !== id || !contenedor.isConnected) return;
      const paginas = Math.min(pdf.numPages, 6);
      contenedor.innerHTML = `<div class="pdf-bar"><b>Documento PDF</b><span id="pdf-pag">${pdf.numPages} ${pdf.numPages === 1 ? "página" : "páginas"}</span></div><div class="pdf-pages"></div>`;
      const hojas = contenedor.querySelector(".pdf-pages");
      const indicador = contenedor.querySelector("#pdf-pag");
      for (let i = 1; i <= paginas; i++) {
        const pagina = await pdf.getPage(i);
        const ancho = Math.max(hojas.clientWidth - 24, 280);
        const base = pagina.getViewport({ scale: 1 });
        const vp = pagina.getViewport({ scale: (ancho / base.width) * Math.min(window.devicePixelRatio || 1, 2) });
        const canvas = document.createElement("canvas");
        canvas.width = Math.floor(vp.width); canvas.height = Math.floor(vp.height);
        canvas.dataset.pagina = i;
        canvas.setAttribute("aria-label", `Página ${i} de ${pdf.numPages}`);
        hojas.appendChild(canvas);
        await pagina.render({ canvasContext: canvas.getContext("2d"), viewport: vp }).promise;
      }
      if (pdf.numPages > paginas) hojas.insertAdjacentHTML("beforeend", `<p class="note" style="text-align:center">Faltan ${pdf.numPages - paginas} páginas. Usa "Abrir PDF completo".</p>`);
      // Indicador de página al desplazarse, como en un visor de documentos
      if (pdf.numPages > 1) {
        const actualizar = () => {
          const arriba = hojas.scrollTop + hojas.clientHeight / 3;
          let n = 1;
          for (const c of hojas.querySelectorAll("canvas")) if (c.offsetTop <= arriba) n = +c.dataset.pagina;
          indicador.textContent = `Página ${n} de ${pdf.numPages}`;
        };
        hojas.addEventListener("scroll", actualizar, { passive: true });
        actualizar();
      }
    } catch (e) {
      if (contenedor.isConnected) contenedor.innerHTML = `<p class="note">No se pudo mostrar el documento: ${esc(e.message)}. Usa "Abrir PDF completo".</p>`;
    }
  }


  async function leerCsf(boton, s, regimenes, automatico) {
    const estado = $("#csf-estado");
    if (boton) boton.disabled = true;
    estado.textContent = "Leyendo la constancia…";
    try {
      const pdf = await obtenerPdf(`/panel/api/solicitudes/${s.id}/archivo/csf`);
      let textoPdf = "";
      for (let i = 1; i <= Math.min(pdf.numPages, 3); i++) {
        const c = await (await pdf.getPage(i)).getTextContent();
        textoPdf += " " + c.items.map(it => it.str).join(" ");
      }
      if (estadoState.actual !== s.id) return;
      const d = extraerCsf(textoPdf.replace(/\s+/g, " "), regimenes);
      if (!d.rfc && !d.nombre) { estado.textContent = "La constancia no tiene texto legible (puede ser un escaneo). Captura los datos viendo el documento."; if (boton) boton.disabled = false; return; }
      if (d.rfc) $("#d-rfc").value = d.rfc;
      if (d.nombre) $("#d-nombre").value = d.nombre;
      if (d.cp) $("#d-cp").value = d.cp;
      if (d.regimen) $("#d-regimen").value = d.regimen;
      const varios = d.regimenes > 1;
      if (automatico && !varios && d.rfc && d.nombre && d.cp && d.regimen) {
        // Datos completos y sin ambigüedad: se guardan solos
        await guardarDatos($("#guardar-datos"), true);
        toast("Datos leídos de la constancia");
        return;
      }
      estado.textContent = varios ? "Leído. La constancia tiene varios regímenes: elige el correcto y presiona Guardar datos." : "Leído. Revisa contra el documento y presiona Guardar datos.";
      $("#guardar-datos").onclick = e => guardarDatos(e.target, true);
      $("#d-regimen").focus();
    } catch (e) { estado.textContent = "No se pudo leer: " + e.message; }
    if (boton) boton.disabled = false;
  }


  function extraerCsf(t, regimenes) {
    const etiquetas = ["RFC:", "CURP:", "Nombre \\(s\\):", "Nombre\\(s\\):", "Primer Apellido:", "Segundo Apellido:", "Fecha inicio de operaciones:", "Estatus en el padrón:", "Fecha de último cambio de estado:", "Nombre Comercial:", "Denominación/Razón Social:", "Régimen Capital:", "Datos del domicilio registrado", "Código Postal:", "Tipo de Vialidad:", "Nombre de Vialidad:", "Número Exterior:", "idCIF:", "Lugar y Fecha de Emisión"];
    const valor = etq => {
      const m = t.match(new RegExp(etq + "\\s*(.*?)\\s*(?=" + etiquetas.join("|") + "|$)"));
      return m ? m[1].trim() : "";
    };
    let rfc = (valor("RFC:").match(/[A-ZÑ&]{3,4}\d{6}[A-Z0-9]{3}/) || t.match(/\b[A-ZÑ&]{3,4}\d{6}[A-Z0-9]{3}\b/) || [""])[0];
    const razon = valor("Denominación/Razón Social:");
    let nombre = razon;
    if (!nombre) nombre = [valor("Nombre \\(s\\):") || valor("Nombre\\(s\\):"), valor("Primer Apellido:"), valor("Segundo Apellido:")].filter(Boolean).join(" ");
    const cp = (valor("Código Postal:").match(/\d{5}/) || [""])[0];
    const norm = s => s.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
    const tn = norm(t);
    const encontrados = Object.entries(regimenes).filter(([, v]) => tn.includes(norm(v)));
    // Si un nombre de régimen contiene a otro, prefiere el más largo
    encontrados.sort((a, b) => b[1].length - a[1].length);
    return { rfc, nombre: nombre.toUpperCase(), cp, regimen: encontrados[0]?.[0] || "", regimenes: encontrados.length };
  }

  // ---- Deslizar a la derecha para eliminar (solo en Rechazadas), como en Correo ----

  }
  function confirmarPendiente() {

    const p = pendiente; pendiente = null; clearTimeout(p.timer);

    return ejecutarBorrado(p);

  function eliminarDeslizando(sw) {
    if (!sw) return;
    confirmarPendiente(); // si había otro esperando, se confirma ya
    const id = sw.dataset.id, it = sw.querySelector(".item");
    borrandoIds.add(id);

    $("#undo").hidden = false;
    pendiente = { id, sw, timer: setTimeout(confirmarPendiente, 5000) };

  $("#undo-btn").addEventListener("click", () => {
    if (!pendiente) return;
    clearTimeout(pendiente.timer); borrandoIds.delete(pendiente.id); pendiente = null;
    $("#undo").hidden = true; toast("Se recuperó la solicitud"); cargarLista();

  // Si se cierra la página con un borrado esperando, se envía de inmediato
  addEventListener("pagehide", () => {

    fetch(`/panel/api/solicitudes/${pendiente.id}/eliminar`, { method: "POST", body: "{}", keepalive: true, headers: { "X-Panel": "1", "Content-Type": "application/json" } });
    pendiente = null;

  const lista = $("#lista");
  lista.addEventListener("pointerdown", e => {
    const it = e.target.closest(".swipe .item");
    if (!it || (e.pointerType === "mouse" && e.button !== 0)) return;
    document.querySelectorAll(".swipe.abierto").forEach(sw => { if (!sw.contains(it)) cerrarSwipe(sw); });
    const sw = it.closest(".swipe");
    gesto = { it, sw, x0: e.clientX, y0: e.clientY, base: sw.classList.contains("abierto") ? ANCHO_BOTON : 0, dx: 0, activo: false, id: e.pointerId };
  });
  lista.addEventListener("pointermove", e => {
    if (!gesto || e.pointerId !== gesto.id) return;
    const dx = e.clientX - gesto.x0, dy = e.clientY - gesto.y0;
    if (!gesto.activo) {
      if (Math.abs(dy) > 10 && Math.abs(dy) > Math.abs(dx)) { gesto = null; return; } // es scroll vertical
      if (Math.abs(dx) < 10) return;
      gesto.activo = true;
      try { gesto.it.setPointerCapture(e.pointerId); } catch {}
      gesto.it.style.transition = "none";
    }
    const ancho = gesto.sw.offsetWidth;
    let x = Math.max(0, gesto.base + dx);
    if (x > ancho * 0.6) x = ancho * 0.6 + (x - ancho * 0.6) * 0.5; // resistencia al final
    gesto.dx = x;
    gesto.it.style.transform = `translateX(${x}px)`;
    gesto.sw.classList.toggle("listo", x > ancho * 0.45);
    e.preventDefault();
  });
  const soltar = e => {
    if (!gesto || e.pointerId !== gesto.id) return;
    const g = gesto; gesto = null;
    if (!g.activo) return;
    g.it.dataset.deslizado = "1";
    setTimeout(() => { g.it.dataset.deslizado = ""; }, 400);
    const ancho = g.sw.offsetWidth;
    g.sw.classList.remove("listo");
    if (g.dx > ancho * 0.45) { eliminarDeslizando(g.sw); return; }
    g.it.style.transition = "transform .35s cubic-bezier(.16,1,.3,1)";
    if (g.dx > ANCHO_BOTON * 0.6) { g.it.style.transform = `translateX(${ANCHO_BOTON}px)`; g.sw.classList.add("abierto"); }
    else cerrarSwipe(g.sw);
  };
  lista.addEventListener("pointerup", soltar);
  lista.addEventListener("pointercancel", soltar);

  // Eventos generales
  document.addEventListener("click", async e => {
    const c = e.target.closest(".copy");
    if (c) {
      const v = c.dataset.copy;
      try { await navigator.clipboard.writeText(v); } catch { const r = document.createRange(); r.selectNodeContents(c.previousElementSibling); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); }
      c.textContent = "Copiado"; c.classList.add("hecho");
      setTimeout(() => { c.textContent = "Copiar"; c.classList.remove("hecho"); }, 1500);
      return;
    }
    const del = e.target.closest(".swipe-del");
    if (del) { const sw = del.closest(".swipe"); eliminarDeslizando(sw); return; }
    const it = e.target.closest(".item");
    if (it) {
      if (it.dataset.deslizado === "1") { it.dataset.deslizado = ""; return; }
      const sw = it.closest(".swipe.abierto"); if (sw) { cerrarSwipe(sw); return; }
      abrir(it.dataset.id);
    }
    const tab = e.target.closest(".tab");
    if (tab) {
      document.querySelectorAll(".tab").forEach(t => t.setAttribute("aria-selected", t === tab ? "true" : "false"));
      estadoState.estado = tab.dataset.estado; estadoState.actual = null;
      $("#detalle").innerHTML = `<p class="empty">Elige una solicitud de la lista.</p>`;
      $("#work").classList.remove("ver-detalle");
      cargarLista();
    }
  });
  let h; $("#q").addEventListener("input", e => { clearTimeout(h); h = setTimeout(() => { estadoState.q = e.target.value.trim(); cargarLista(); }, 300); });
  $("#recargar").addEventListener("click", cargarLista);
  const hoy = new Date(Date.now() - 6 * 3600e3);
  $("#exp-mes").value = hoy.toISOString().slice(0, 7);
  const urlExport = () => `/panel/api/exportar?${new URLSearchParams({ mes: $("#exp-mes").value, estado: $("#exp-estado").value })}`;
  $("#exp-ir").addEventListener("click", e => { e.currentTarget.href = urlExport(); });
  setInterval(() => { if (!document.hidden) cargarLista(); }, 60000);
  api("yo").then(j => { $("#yo").textContent = j.email; }).catch(() => {});
  cargarLista();
})();
</script>

  // ---- Expediente en PDF (se arma en el navegador con pdf-lib) ----
  let pdfLib = null;
  function cargarPdfLib() {
    if (pdfLib) return pdfLib;
    pdfLib = new Promise((res, rej) => { const sc = document.createElement("script"); sc.src = "https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"; sc.onload = () => res(window.PDFLib); sc.onerror = () => { pdfLib = null; rej(new Error("No se pudo cargar el generador de PDF. Revisa tu conexión.")); }; document.head.appendChild(sc); });
    return pdfLib;
  }
  async function aJpeg(blob) {
    const img = await createImageBitmap(blob, { imageOrientation: "from-image" });
    const k = Math.min(1, 2000 / Math.max(img.width, img.height));
    const cv = document.createElement("canvas"); cv.width = Math.round(img.width * k); cv.height = Math.round(img.height * k);
    cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height);
    return new Uint8Array(await (await new Promise(r => cv.toBlob(r, "image/jpeg", 0.85))).arrayBuffer());
  }
  async function generarPdf(c) {
    const estado = $("#p-pdf-estado"), b = $("#p-pdf");
    b.disabled = true; estado.textContent = "Armando el PDF…";
    try {
      const { PDFDocument, StandardFonts, rgb } = await cargarPdfLib();
      const pdf = await PDFDocument.create();
      pdf.setTitle(`${c.tipo === "externo" ? "Registro de externo" : "Expediente laboral"} · ${c.nombre}`); pdf.setAuthor("Báscula y Pensión El Castaño");
      const f = await pdf.embedFont(StandardFonts.Helvetica), fb = await pdf.embedFont(StandardFonts.HelveticaBold);
      const W = 612, H = 792, M = 48;
      const limpio = t => String(t ?? "").replace(/[^\x20-\x7E\u00A0-\u00FF]/g, "");
      let pg = pdf.addPage([W, H]), y = H - M;
      const nueva = () => { pg = pdf.addPage([W, H]); y = H - M; };
      const texto = (t, { size = 10.5, bold = false, color = rgb(0.1, 0.1, 0.1), x = M } = {}) => {
        const font = bold ? fb : f, maxW = W - M - x; let linea = "";
        const salidas = [];
        for (const palabra of limpio(t).split(" ")) { const prueba = linea ? linea + " " + palabra : palabra; if (font.widthOfTextAtSize(prueba, size) > maxW && linea) { salidas.push(linea); linea = palabra; } else linea = prueba; }
        salidas.push(linea);
        for (const l of salidas) { if (y < M + size) nueva(); pg.drawText(l, { x, y: y - size, size, font, color }); y -= size * 1.45; }
      };
      // Logo y encabezado
      try { const logo = await pdf.embedPng(await (await fetch("/img/logo.png")).arrayBuffer()); pg.drawImage(logo, { x: M, y: H - M - 58, width: 42, height: 58 }); } catch {}
      y = H - M - 6; texto("BÁSCULA Y PENSIÓN EL CASTAÑO", { size: 9, bold: true, color: rgb(0.45, 0.45, 0.45), x: M + 56 });
      const ext = c.tipo === "externo";
      texto(ext ? "Registro de externo" : "Expediente laboral", { size: 22, bold: true, x: M + 56 });
      texto(`${c.nombre} · Folio ${c.folio}`, { size: 14, x: M + 56 });
      y = Math.min(y, H - M - 72) - 10;
      const seccion = t => { y -= 8; if (y < M + 60) nueva(); texto(t.toUpperCase(), { size: 9.5, bold: true, color: rgb(0.55, 0.42, 0) }); pg.drawLine({ start: { x: M, y: y + 4 }, end: { x: W - M, y: y + 4 }, thickness: 0.6, color: rgb(0.8, 0.8, 0.8) }); y -= 4; };
      const fila = (k, v) => {
        if (y < M + 20) nueva();
        if (f.widthOfTextAtSize(limpio(k), 10) > 140) { texto(k, { size: 10, color: rgb(0.42, 0.42, 0.42) }); y += 4; }
        else { pg.drawText(limpio(k), { x: M, y: y - 10.5, size: 10, font: f, color: rgb(0.42, 0.42, 0.42) }); }
        const y0 = y; texto(v || "-", { x: M + 150 }); if (y > y0 - 15) y = y0 - 15;
      };
      const d = c.datos, a = c.admin;
      seccion(ext ? "Actividad dentro de El Castaño" : "Datos laborales");
      fila("Estatus", c.estatus === "inactivo" ? `Inactivo desde ${fecha(c.fecha_baja)}${c.motivo_baja ? " · " + c.motivo_baja : ""}` : "Activo");
      if (ext) { fila("Actividad", a.actividad); fila("Nacionalidad", a.nacionalidad || "Nacional"); fila("Fecha de inicio", fecha(a.fecha_ingreso)); fila("Días u horario", a.turno); }
      else { fila("Puesto", a.puesto); fila("Nacionalidad", a.nacionalidad || "Nacional"); fila("Fecha de ingreso", fecha(a.fecha_ingreso)); fila("Turno u horario", a.turno); fila("Fecha de entrevista", fecha(a.fecha_entrevista)); }
      seccion("Datos personales");
      fila("Nombre completo", d.nombre); fila("Fecha de nacimiento", fecha(d.fecha_nacimiento)); fila("Lugar de nacimiento", d.lugar_nacimiento); fila("CURP", d.curp); fila("Estado civil", d.estado_civil); fila("Teléfono", d.telefono); fila("Correo electrónico", d.correo);
      seccion("Domicilio");
      fila("Calle y número", d.calle); fila("Colonia", d.colonia); fila("Municipio", d.municipio); fila("Código postal", d.cp);
      seccion("Contacto de emergencia");
      fila("Nombre", d.emerg_nombre); fila("Parentesco", d.emerg_parentesco); fila("Teléfono", d.emerg_telefono);
      if (!ext) seccion("Escolaridad");
      if (!ext) { fila("Último grado", d.escolaridad); fila("Escuela", d.institucion); }
      seccion("Documentos");
      for (const x of c.docs) fila(x.nombre, x.recibido ? `Entregado ${fecha(x.fecha)}${x.fotos.length ? " · foto anexa" : " · en físico"}` : "Pendiente");
      if (c.admin_docs.length) { seccion("Documentos administrativos"); for (const x of c.admin_docs) fila(fecha(x.fecha), x.descripcion); }
      if (a.notas) { seccion(ext ? "Notas" : "Notas de la entrevista"); texto(a.notas); }
      y -= 10; texto(`Generado el ${new Intl.DateTimeFormat("es-MX", { timeZone: "America/Mexico_City", dateStyle: "long", timeStyle: "short" }).format(new Date())} · Datos tratados conforme al aviso de privacidad para colaboradores.`, { size: 8, color: rgb(0.5, 0.5, 0.5) });

      // Anexos: fotos y PDFs
      const anexos = [];
      for (const x of c.docs) for (const ft of x.fotos) anexos.push({ titulo: x.nombre + (ft.archivo === "ine2" ? " (reverso)" : ft.archivo === "ine" ? " (frente)" : ft.archivo === "solicitud2" ? " (hoja 2)" : ""), url: `/panel/api/colaboradores/${c.id}/archivo/${ft.archivo}` });
      for (const x of c.admin_docs) anexos.push({ titulo: `${x.descripcion} (${fecha(x.fecha)})`, url: `/panel/api/colaboradores/${c.id}/archivo-admin/${x.id}` });
      let n = 0;
      for (const ax of anexos) {
        n++; estado.textContent = `Agregando anexos ${n} de ${anexos.length}…`;
        const r = await fetch(ax.url); if (!r.ok) continue;
        const tipo = (r.headers.get("Content-Type") || "").split(";")[0];
        const bytes = new Uint8Array(await r.arrayBuffer());
        if (tipo === "application/pdf") {
          try {
            const otro = await PDFDocument.load(bytes, { ignoreEncryption: true });
            const pags = await pdf.copyPages(otro, otro.getPageIndices());
            pags.forEach((p, i) => { pdf.addPage(p); if (i === 0) p.drawText(limpio("Anexo: " + ax.titulo), { x: 18, y: p.getHeight() - 16, size: 8, font: fb, color: rgb(0.55, 0.42, 0) }); });
          } catch { nueva(); texto("Anexo: " + ax.titulo, { bold: true }); texto("No se pudo incluir este PDF (está protegido o dañado). Descárgalo desde el panel."); }
          continue;
        }
        let img;
        try { img = tipo === "image/jpeg" ? await pdf.embedJpg(bytes) : tipo === "image/png" ? await pdf.embedPng(bytes) : await pdf.embedJpg(await aJpeg(new Blob([bytes], { type: tipo }))); }
        catch { nueva(); texto("Anexo: " + ax.titulo, { bold: true }); texto("No se pudo incluir esta imagen por su formato. Descárgala desde el panel."); continue; }
        nueva(); texto("Anexo: " + ax.titulo, { size: 12, bold: true });
        const maxW = W - 2 * M, maxH = y - M, k = Math.min(maxW / img.width, maxH / img.height);
        pg.drawImage(img, { x: M + (maxW - img.width * k) / 2, y: y - img.height * k, width: img.width * k, height: img.height * k });
      }
      const out = await pdf.save();
      const url = URL.createObjectURL(new Blob([out], { type: "application/pdf" }));
      const link = document.createElement("a"); link.href = url; link.download = `${c.folio}-${ext ? "Registro-externo" : "Expediente"}-${c.nombre.normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^\w]+/g, "-")}.pdf`;
      document.body.appendChild(link); link.click(); link.remove(); setTimeout(() => URL.revokeObjectURL(url), 30000);
      estado.textContent = `Listo: ${pdf.getPageCount()} páginas.`;
    } catch (e) { estado.textContent = e.message || "No se pudo generar el PDF."; }
    b.disabled = false;
  }

  $("#p-drive").addEventListener("click", async e => {
    const b = e.currentTarget; b.disabled = true; $("#p-drive-nota").textContent = "Probando…";
    try { const r = await post("colaboradores/drive-probar"); st.config = r.config; $("#p-drive-nota").textContent = "Drive conectado: los documentos se copian solos a la carpeta de cada persona. Para los que ya estaban, usa «Copiar a Drive» en cada ficha."; }
    catch (err) { $("#p-drive-nota").textContent = err.message; }
    b.disabled = false;
  });
  $("#p-flim").addEventListener("change", async e => {
    try { const r = await post("colaboradores/config", { fecha_limite: e.target.value }); st.config = r.config; toast(r.config.fecha_limite ? "Fecha límite guardada" : "Fecha límite quitada"); cargar(); } catch (err) { toast(err.message); }
  });
  $("#p-recordar-todos").addEventListener("click", async e => {
    const b = e.currentTarget;
    if (!b.classList.contains("armed")) { b.classList.add("armed"); b.textContent = "¿Enviar correo a todos los incompletos?"; setTimeout(() => { b.classList.remove("armed"); b.textContent = "Recordar a incompletos"; }, 4000); return; }
    b.classList.remove("armed"); b.disabled = true; b.textContent = "Enviando…";
    try {
      const r = await post("colaboradores/recordar-todos", { tipo: st.tipo });
      toast(`${r.enviados} recordatorio${r.enviados === 1 ? "" : "s"} enviado${r.enviados === 1 ? "" : "s"}`);
      $("#p-flim-nota").textContent = [r.enviados ? `Enviados: ${r.enviados}.` : "", r.sin_correo.length ? `Sin correo (mándales WhatsApp desde su ficha): ${r.sin_correo.join(", ")}.` : "", r.errores ? r.error : ""].filter(Boolean).join(" ") || "Nadie tiene pendientes.";
    } catch (err) { toast(err.message); }
    b.disabled = false; b.textContent = "Recordar a incompletos";
  });

  function nuevo() {
    st.actual = null;
    document.querySelectorAll(".pitem").forEach(b => b.removeAttribute("aria-current"));
    $("#p-work").classList.add("ver-detalle");
    const d = $("#p-detalle");
    st.listas = { ...(st.listas || {}), puestos: ["Báscula y Pensión", "Administración", "Mantenimiento"], nacionalidad: ["Nacional", "Naturalizado"], actividades: ["Lavado de trailers", "Venta de ropa", "Venta de comida", "Otra"] };
    const ext = EXT();
    d.innerHTML = `
      <button class="btn btn-line back" id="p-volver" type="button">← Volver a la lista</button>
      <div class="detail-head"><h2>${ext ? "Nuevo externo" : "Nuevo colaborador"}</h2></div>
      <section class="card" id="p-alta" style="max-width:640px">
        <p class="note" style="margin:0">${ext ? "Al crearlo se le asigna su folio y su registro se envía al encargado de turno (correo entrada@basculaypension.com y WhatsApp 962 216 5453), que lo completa con la persona presente. Al externo no se le envía nada." : "Al crearlo se genera su enlace personal: le llega por correo si escribes su correo, y se abre tu WhatsApp con el mensaje listo para enviárselo. Él llena el resto desde su celular."}</p>
        <div class="grid-form">
          ${input("nombre", "Nombre completo", "wide")}
          ${input("telefono", ext ? "Teléfono del externo (opcional)" : "WhatsApp", "", "tel")}
          ${ext ? "" : input("correo", "Correo electrónico", "", "email")}
          ${input("nacionalidad", "Nacionalidad", "", "lista:nacionalidad", "Nacional")}
          <p class="note wide" style="margin:-4px 0 0;font-size:.85rem">Nacional: se le pide INE. Naturalizado: se le pide pasaporte o tarjeta de residente.</p>
          ${ext ? input("actividad", "Actividad", "", "lista:actividades") : input("puesto", "Puesto", "", "lista:puestos")}
          ${input("fecha_ingreso", ext ? "Fecha de inicio" : "Fecha de ingreso", "", "date")}
        </div>
        <div class="row"><button class="btn btn-primary" id="p-crear" type="button">${ext ? "Crear y enviar al encargado" : "Crear y enviar enlace"}</button></div>
      </section>`;
    $("#p-volver").addEventListener("click", () => { $("#p-work").classList.remove("ver-detalle"); d.innerHTML = `<p class="empty">Elige un colaborador o agrega uno nuevo.</p>`; });
    $("#p-crear").addEventListener("click", async e => {
      const b = e.currentTarget; b.disabled = true;
      const cont = $("#p-alta");
      const valores = { ...leer(cont), tipo: st.tipo };
      const tel = (valores.telefono || "").replace(/\D/g, "").slice(-10);
      // La ventana de WhatsApp se abre en el mismo toque (si no, el navegador la bloquea) y se llena al tener el enlace
      const ventana = valores.tipo === "externo" ? window.open("", "_blank") : tel.length === 10 ? window.open("", "_blank") : null;
      try {
        const r = await post("colaboradores", valores);
        if (ventana && valores.tipo === "externo") ventana.location.href = urlWa(ENCARGADO_WA, msgEncargadoAlta(valores.nombre, r.folio, valores.actividad, r.token));
        else if (ventana) {
          const nat = valores.nacionalidad === "Naturalizado";
          const idDoc = nat ? "identificación oficial (pasaporte o tarjeta de residente)" : "INE";
          const docs = valores.tipo === "externo" ? [idDoc, "CURP", "comprobante de domicilio", "una foto tuya"] : [idDoc, "CURP", "solicitud de empleo", "acta de nacimiento", "comprobante de domicilio", "comprobante de último grado de estudios"];
          ventana.location.href = urlWa(tel, mensajeWa(valores.nombre, r.token, docs, valores.tipo));
        }
        await cargar(); await abrir(r.id);
        if (r.correo && r.correo.error) { toast("Creado. " + r.correo.error); $("#p-correo-estado").textContent = r.correo.error; }
        else if (r.correo && r.correo.enviado) toast(valores.tipo === "externo" ? "Externo creado y enviado al encargado" : "Creado y enviado por correo");
        else toast(valores.tipo === "externo" ? "Externo registrado" : "Colaborador creado");
      } catch (err) { if (ventana) ventana.close(); errores(cont, err.errores); toast(err.message); b.disabled = false; }
    });
    $("#p-alta [data-k=nombre]").focus();
  }

  $("#p-lista").addEventListener("click", e => { const it = e.target.closest(".pitem"); if (it) abrir(it.dataset.id); });
  document.querySelectorAll(".ptabs").forEach(g => g.addEventListener("click", e => {
    const t = e.target.closest(".ptab"); if (!t) return;
    g.querySelectorAll(".ptab").forEach(x => x.setAttribute("aria-selected", x === t ? "true" : "false"));
    if (t.dataset.tipo) {
      st.tipo = t.dataset.tipo; st.actual = null; $("#p-detalle").innerHTML = `<p class="empty">Elige ${EXT() ? "a una persona externa" : "un colaborador"} o agrega uno nuevo.</p>`; $("#p-work").classList.remove("ver-detalle");
      $("#p-nuevo").textContent = EXT() ? "+ Nuevo externo" : "+ Nuevo colaborador";
      $("#p-q").placeholder = EXT() ? "Buscar por nombre, folio, actividad o teléfono" : "Buscar por nombre, folio, puesto o teléfono";
    }
    else if (t.dataset.estatus) { st.estatus = t.dataset.estatus; st.actual = null; $("#p-detalle").innerHTML = `<p class="empty">Elige un colaborador o agrega uno nuevo.</p>`; $("#p-work").classList.remove("ver-detalle"); }
    else st.filtro = t.dataset.filtro;
    cargar();
  }));
  let h; $("#p-q").addEventListener("input", e => { clearTimeout(h); h = setTimeout(() => { st.q = e.target.value.trim(); cargar(); }, 300); });
  $("#p-nuevo").addEventListener("click", nuevo);

  if (location.hash === "#personal") mostrar("personal");
})();
</script>
</body>
</html>
