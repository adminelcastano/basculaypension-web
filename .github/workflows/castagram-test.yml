name: Pruebas de Castagram
on:
  push:
    branches:
      - main
      - castagram/cierre-seguridad-20261017
      - feat/caja-dinero-integral-20261021
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  node-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Evitar nuevos archivos de estado local o credenciales
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          base="$BASE_SHA"
          if ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            base="$(git rev-parse HEAD^)"
          fi
          changed="$(git diff --name-only --diff-filter=ACMRT "$base" HEAD)"
          forbidden="$(printf '%s\n' "$changed" | grep -E '^(\.wrangler/|\.dev\.vars|\.env($|\.))' | grep -vxF '.env.example' || true)"
          if [ -n "$forbidden" ]; then
            echo "::error::No incorporar ni modificar archivos locales de Wrangler o credenciales."
            printf '%s\n' "$forbidden"
            exit 1
          fi
      - name: Instalar dependencias para las compilaciones privadas
        run: npm install --ignore-scripts --no-audit --no-fund --no-save wrangler@4.151.1
      - name: Pruebas del proyecto (sin datos productivos)
        run: node --test pruebas/*.test.js
      - name: Validar compilación de Workers sin publicar
        run: ./node_modules/.bin/wrangler deploy --dry-run --outdir /tmp/bascula-worker-validado

      - name: Validar compilación de Finanzas ensayo sin publicar
        run: ./node_modules/.bin/wrangler deploy --config wrangler.finanzas-ensayo.jsonc --dry-run --outdir /tmp/finanzas-ensayo-validado

  ux-refactor:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar navegador de pruebas sin ejecutar scripts de paquetes
        run: npm install --ignore-scripts --no-save --no-audit --no-fund playwright@1.56.1
      - name: Instalar Chromium y WebKit
        run: npx playwright install --with-deps chromium webkit
      - name: Agenda y Personal con datos sintéticos (Chromium y WebKit)
        run: node pruebas/ux-agenda-personal-sintetico.mjs
      - name: Navegación y viewport en servidor local sintético (11 perfiles)
        run: node pruebas/ux-browser-emulado.mjs
      - name: Turno sin PIN válido y aislamiento de tablet compartida (Chromium/WebKit)
        run: node pruebas/ux-turno-prepublicacion.mjs
      - name: Panel Financiero con API ficticia (escritorio y teléfono)
        run: node pruebas/ux-panel-financiero.mjs
      - name: Capturas exclusivamente sintéticas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: refactor-ux-11-perfiles
          path: ux-artifacts/*.png
          retention-days: 3
          if-no-files-found: warn
