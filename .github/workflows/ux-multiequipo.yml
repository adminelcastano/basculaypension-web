name: UX multiequipo de CAJA DINERO
on:
  push:
    branches: [feat/caja-dinero-integral-20261021]
    paths:
      - src/panel/**
      - pruebas/ux-browser-emulado.mjs
      - .github/workflows/ux-multiequipo.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ux:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar Playwright temporal
        run: npm install --no-save --ignore-scripts --no-audit --no-fund playwright@1.56.1
      - name: Instalar Chromium y WebKit
        run: npx playwright install --with-deps chromium webkit
      - name: Verificar navegación y geometría de 11 perfiles con datos sintéticos
        run: node pruebas/ux-browser-emulado.mjs
      - name: Capturas sintéticas para inspección visual
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: UX-PR46-Chromium-WebKit
          path: ux-artifacts/*.png
          retention-days: 7
          if-no-files-found: warn
